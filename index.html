    search.addEventListener("input", ()=>{
      const v = search.value.trim().toLowerCase(); let shown=0;
      [...acc.children].forEach((item,i)=>{ const it = DATA.kb_faqs_full[i];
        const hay = (it.question_ar+" "+it.answer_ar+" "+(it.answer_en||"")).toLowerCase();
        const show = v===""||hay.includes(v); item.style.display = show?"":"none"; if(show) shown++; });
      count.textContent = shown + " سؤال";
    });
    wrap.appendChild(el("div",{class:"table-toolbar"}, search, count));
    wrap.appendChild(acc);
    return wrap;
  }

  /* ---------------- Build single-page layout ---------------- */
  function buildHero(){
    return el("section",{class:"hero", id:"top"},
      el("div",{class:"hero-badge"},"دليل خدمة العملاء الداخلي"),
      el("h1",null,"بوابة معرفة NowPay"),
      el("p",{class:"hero-sub"},"كل حاجة محتاجها وانت في مكالمة مع العميل — منظمة حسب الموضوع: نظرة عامة، السياسات، التحقق، إجراءات الموظف، توعية العميل، الأسئلة الشائعة، استكشاف الأخطاء، وOps Tool — في مكان واحد وقابلة للبحث الفوري."),
      el("div",{class:"hero-quick"}, ...MOST_USED.map(id=>{
        const t = byId[id]; if(!t) return null;
        return el("button",{class:"hero-quick-btn", onclick:()=>gotoTopic(id)}, t.icon+" "+t.title);
      }))
    );
  }
  function slug(s){ return String(s).replace(/[^a-zA-Z0-9\u0600-\u06FF_-]/g,'-'); }

  function buildPage(){
    const main = document.getElementById("main-content");
    main.appendChild(buildHero());
    CAT_ORDER.forEach(cat=>{
      const items = TOPICS.filter(t=>t.cat===cat);
      if(!items.length) return;
      main.appendChild(el("h2",{class:"cat-heading", id:"cat-"+slug(cat)}, el("span",{class:"cat-heading-icon"},CAT_ICON[cat]||"📁"), cat));
      items.forEach(t => main.appendChild(buildTopicCard(t, false)));
    });
  }

  function buildTopicCard(t, openDefault){
    const details = el("details",{class:"topic-card", id:"topic-"+t.id});
    if(openDefault) details.setAttribute("open","");
    const summary = el("summary",{class:"topic-summary", "data-id":t.id},
      el("span",{class:"topic-icon"}, t.icon),
      el("span",{class:"topic-summary-text"},
        el("span",{class:"breadcrumb"}, "مرجع خدمة العملاء › "+t.cat),
        el("span",{class:"topic-title"}, t.title),
        el("span",{class:"topic-cat"}, t.cat)
      ),
      el("span",{class:"topic-caret"}, "⌄")
    );
    details.appendChild(summary);
    const body = el("div",{class:"topic-body"});

    /* group sections into business categories */
    const map = TOPIC_CATMAP[t.id] || {};
    const buckets = {};
    SEC_CAT_ORDER.forEach(c=> buckets[c] = []);
    let relatedSec = null;

    t.sections.forEach((sec, idx)=>{
      if(sec.type === "related"){ relatedSec = sec; return; }
      const target = map[idx];
      if(!target) return;
      if(target === "actions_ref"){
        const expanded = expandActionsRef(sec.ref);
        if(expanded.validation.items.length) buckets.validation.push(expanded.validation);
        if(expanded.agent_actions.items.length) buckets.agent_actions.push(expanded.agent_actions);
        buckets.ticket_info.push(expanded.ticket_info);
        if(expanded.ops_tool.items.length) buckets.ops_tool.push(expanded.ops_tool);
        return;
      }
      if(!buckets[target]) buckets[target] = [];
      buckets[target].push(sec);
    });

    SEC_CAT_ORDER.forEach(cat=>{
      const secs = buckets[cat];
      if(!secs || !secs.length) return;
      const catBlock = el("div",{class:"topic-section topic-section-"+cat});
      catBlock.appendChild(el("div",{class:"topic-section-head"},
        el("span",{class:"topic-section-icon"}, SEC_CAT_ICON[cat]),
        el("span",null, SEC_CAT_LABEL[cat])
      ));
      secs.forEach(sec=> catBlock.appendChild(renderSection(sec)));
      body.appendChild(catBlock);
    });

    if(relatedSec){
      body.appendChild(renderSection(relatedSec));
    }

    details.appendChild(body);
    return details;
  }

  /* ---------------- Sidebar ---------------- */
  function buildSidebar(){
    const nav = document.getElementById("sidebar-nav");
    CAT_ORDER.forEach(cat=>{
      const items = TOPICS.filter(t=>t.cat===cat);
      if(!items.length) return;
      const groupId = "grp-"+slug(cat);
      const body = el("div",{class:"sb-group-body", id:groupId});
      items.forEach(t=> body.appendChild(el("a",{class:"sb-link","data-id":t.id, href:"#topic-"+t.id, onclick:(ev)=>{ev.preventDefault(); gotoTopic(t.id);} },
        el("span",{class:"sb-link-icon"}, t.icon), el("span",null, t.title))));
      const head = el("button",{class:"sb-group-head", type:"button", onclick:(ev)=>{
        const collapsed = body.classList.toggle("collapsed");
        ev.currentTarget.classList.toggle("collapsed", collapsed);
      }}, el("span",{class:"sb-group-icon"}, CAT_ICON[cat]||"📁"), el("span",{class:"sb-group-title"}, cat), el("span",{class:"sb-group-caret"}, "⌄"));
      nav.appendChild(el("div",{class:"sb-group"}, head, body));
    });
  }
  function setActiveSidebar(id){
    document.querySelectorAll(".sb-link").forEach(a=>a.classList.toggle("active", a.dataset.id===id));
  }

  function gotoTopic(id){
    const t = byId[id]; if(!t) return;
    const details = document.getElementById("topic-"+id);
    if(!details) return;
    details.setAttribute("open","");
    setActiveSidebar(id);
    details.scrollIntoView({behavior:"smooth", block:"start"});
    flash(details);
    closeMobileSidebar();
  }
  function flash(node){
    node.classList.remove("flash-highlight");
    void node.offsetWidth;
    node.classList.add("flash-highlight");
    setTimeout(()=>node.classList.remove("flash-highlight"), 2200);
  }

  /* ---------------- Scrollspy ---------------- */
  function initScrollspy(){
    const summaries = [...document.querySelectorAll(".topic-summary")];
    const io = new IntersectionObserver((entries)=>{
      entries.forEach(entry=>{
        if(entry.isIntersecting){
          setActiveSidebar(entry.target.dataset.id);
        }
      });
    }, {root:null, rootMargin:"-15% 0px -70% 0px", threshold:0});
    summaries.forEach(s=>io.observe(s));
  }

  /* ---------------- Search index ---------------- */
  let SEARCH_INDEX = null;
  function buildSearchIndex(){
    const idx = [];
    TOPICS.forEach(t=>{
      idx.push({type:"topic", id:t.id, title:t.title, snippet:t.cat, weight:3, text:(t.title+" "+t.keywords).toLowerCase(), target:"topic-"+t.id});
      const map = TOPIC_CATMAP[t.id] || {};
      t.sections.forEach((sec, secIdx)=>{
        const cat = map[secIdx];
        const catLabel = SEC_CAT_LABEL[cat] || t.title;
        if(sec.type==="faq"){
          sec.items.forEach(f=> idx.push({type:"faq", id:t.id, title:f.q, snippet:t.title, weight:2, text:(f.q+" "+f.a).toLowerCase(), target:"topic-"+t.id, faqQ:f.q}));
        } else if(["list","steps","notes","validation"].includes(sec.type)){
          idx.push({type: cat||"section", id:t.id, title: sec.title||t.title, snippet:t.title+" — "+catLabel, weight:1, text:((sec.items||[]).join(" ")+" "+(sec.title||"")).toLowerCase(), target:"topic-"+t.id});
        } else if(sec.type==="statuses"){
          sec.items.forEach(s=> idx.push({type:"status", id:t.id, title:s.name, snippet:t.title, weight:2, text:(s.name+" "+s.desc).toLowerCase(), target:"topic-"+t.id}));
        } else if(sec.type==="overview"){
          idx.push({type:"section", id:t.id, title:t.title, snippet:t.cat, weight:1, text:sec.text.toLowerCase(), target:"topic-"+t.id});
        } else if(sec.type==="table_ref" && sec.ref && sec.ref.indexOf("actions_")===0){
          (DATA[sec.ref]||[]).forEach(row=> idx.push({type: cat||"ticket_info", id:t.id, title:(row.type||"").split("\n")[0], snippet:t.title+" — بيانات التذكرة", weight:1, text:JSON.stringify(row).toLowerCase(), target:"topic-"+t.id}));
        }
      });
    });
    DATA.kb_faqs_full.forEach(f=> idx.push({type:"faq", id:"faq-bank", title:f.question_ar, snippet:"بنك الأسئلة الشائعة", weight:2, text:(f.question_ar+" "+f.answer_ar+" "+(f.answer_en||"")).toLowerCase(), target:"topic-faq-bank"}));
    DATA.banks.forEach(b=> idx.push({type:"bank", id:"bank-formats", title:b.name+" / "+(b.name_ar||""), snippet:"تنسيقات البنوك", weight:1, text:(b.name+" "+(b.name_ar||"")+" "+(b.abbr||"")).toLowerCase(), target:"topic-bank-formats"}));
    return idx;
  }
  function runSearch(q){
    if(!SEARCH_INDEX) SEARCH_INDEX = buildSearchIndex();
    q = q.trim().toLowerCase();
    if(!q) return [];
    const terms = q.split(/\s+/).filter(Boolean);
    const scored = [];
    for(const item of SEARCH_INDEX){
      let score = 0;
      for(const term of terms){
        if(item.title.toLowerCase().includes(term)) score += 5*item.weight;
        if(item.text.includes(term)) score += 1*item.weight;
      }
      if(score>0) scored.push({item, score});
    }
    scored.sort((a,b)=>b.score-a.score);
    return scored.slice(0,30).map(s=>s.item);
  }
  function highlightHTML(text, q){
    const terms = q.trim().split(/\s+/).filter(Boolean).map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
    if(!terms.length) return esc(text);
    const re = new RegExp("("+terms.join("|")+")","gi");
    return esc(text).replace(re, "<mark>$1</mark>");
  }
  function typeLabel(type){
    return {
      topic:"موضوع", faq:"سؤال", section:"محتوى", status:"حالة", company:"شركة", bank:"بنك",
      business_rules:"سياسة", validation:"تحقق", agent_actions:"إجراء موظف", customer_education:"توعية عميل",
      common_issues:"مشكلة شائعة", troubleshooting:"استكشاف أخطاء", ticket_info:"تذكرة", ops_tool:"Ops Tool",
      sla:"SLA", notes:"ملاحظة"
    }[type] || type;
  }

  function gotoSearchResult(r){
    gotoTopic(r.id);
    if(r.faqQ){
      setTimeout(()=>{
        const items = document.querySelectorAll("#topic-"+r.id+" .faq-item");
        for(const item of items){
          if(item.__question === r.faqQ){
            item.querySelector(".faq-body").classList.add("open");
            item.querySelector(".faq-q").classList.add("open");
            item.scrollIntoView({behavior:"smooth", block:"center"});
            flash(item);
            break;
          }
        }
      }, 350);
    }
  }

  function initSearch(){
    const input = document.getElementById("top-search");
    const panel = document.getElementById("global-search-panel");
    const resultsBox = document.getElementById("global-search-results");
    function run(){
      const q = input.value;
      resultsBox.innerHTML = "";
      if(!q.trim()){ panel.classList.remove("open"); return; }
      panel.classList.add("open");
      const results = runSearch(q);
      if(!results.length){ resultsBox.appendChild(el("div",{class:"no-results"},"لا توجد نتائج مطابقة — No Results Found")); return; }
      results.forEach(r=>{
        resultsBox.appendChild(el("button",{class:"search-result-item", onclick:()=>{ gotoSearchResult(r); input.value=""; panel.classList.remove("open"); }},
          el("span",{class:"sr-type"}, typeLabel(r.type)),
          el("span",{class:"sr-title", html: highlightHTML(r.title,q)}),
          el("span",{class:"sr-snip"}, r.snippet)
        ));
      });
    }
    input.addEventListener("input", run);
    input.addEventListener("focus", run);
    document.addEventListener("click",(e)=>{ if(!panel.contains(e.target) && e.target!==input) panel.classList.remove("open"); });
    input.addEventListener("keydown",(e)=>{ if(e.key==="Escape"){ panel.classList.remove("open"); input.blur(); } });
  }

  /* ---------------- Mobile sidebar ---------------- */
  function closeMobileSidebar(){ document.body.classList.remove("sidebar-open"); }
  function initMobileToggle(){
    document.getElementById("menu-toggle").addEventListener("click", ()=> document.body.classList.toggle("sidebar-open"));
    document.getElementById("sidebar-scrim").addEventListener("click", closeMobileSidebar);
  }

  /* ---------------- Back to top ---------------- */
  function initScrollTop(){
    const btn = document.getElementById("floating-top-btn");
    window.addEventListener("scroll", ()=> btn.classList.toggle("visible", window.scrollY > 600));
    btn.addEventListener("click", ()=> window.scrollTo({top:0, behavior:"smooth"}));
  }

  /* ---------------- Init ---------------- */
  function init(){
    buildSidebar();
    buildPage();
    initSearch();
    initMobileToggle();
    initScrollTop();
    initScrollspy();
    document.getElementById("last-updated").textContent = new Date().toLocaleDateString('ar-EG', {year:'numeric', month:'long', day:'numeric'});
    if(location.hash && location.hash.startsWith("#topic-")){
      const id = location.hash.replace("#topic-","");
      setTimeout(()=>gotoTopic(id), 100);
    }
  }
  document.addEventListener("DOMContentLoaded", init);
})();

</script>

<script>
/* =========================================================
   NowPay Knowledge Portal — Updates / Notifications feature
   Self-contained module. Does not touch any existing code.
   ========================================================= */
(function(){
  "use strict";

  const NOTIF_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSdbJXLEplHXanhPYuKVVk3chBc8y4B7WML3exkWGAuF8LgcordS3mDdBtMub7zWT60xaIoIHIqOVKQ/pub?output=csv";
  const NOTIF_STORAGE_KEY = "nowpay_notif_read_ids_v1";
  const NOTIF_REFRESH_MS = 5 * 60 * 1000; // 5 minutes

  let NOTIF_DATA = [];
  let NOTIF_READ_IDS = new Set();
  let NOTIF_LOADED_ONCE = false;
  let NOTIF_DATE_FROM = null;
  let NOTIF_DATE_TO = null;
  let NOTIF_TEXT_QUERY = "";

  /* ---------------- tiny dom helper (local copy, no shared scope) ---------------- */
  function el(tag, attrs, ...children){
    const e = document.createElement(tag);
    if(attrs) for(const k in attrs){
      if(k === "class") e.className = attrs[k];
      else if(k === "html") e.innerHTML = attrs[k];
      else if(k.startsWith("on") && typeof attrs[k] === "function") e.addEventListener(k.slice(2), attrs[k]);
      else if(attrs[k] !== false && attrs[k] !== null && attrs[k] !== undefined) e.setAttribute(k, attrs[k]);
    }
    children.flat().forEach(c => {
      if(c === null || c === undefined || c === false) return;
      if(typeof c === "string") e.appendChild(document.createTextNode(c));
      else e.appendChild(c);
    });
    return e;
  }

  /* ---------------- read/unread persistence ---------------- */
  function notifLoadReadIds(){
    try{
      const raw = localStorage.getItem(NOTIF_STORAGE_KEY);
      NOTIF_READ_IDS = new Set(raw ? JSON.parse(raw) : []);
    }catch(e){ NOTIF_READ_IDS = new Set(); }
  }
  function notifSaveReadIds(){
    try{ localStorage.setItem(NOTIF_STORAGE_KEY, JSON.stringify([...NOTIF_READ_IDS])); }catch(e){}
  }

  /* ---------------- CSV parsing (RFC4180-ish, handles quoted multi-line fields) ---------------- */
  function notifParseCSV(text){
    const rows = [];
    let row = [], field = "", inQuotes = false;
    for(let i = 0; i < text.length; i++){
      const c = text[i];
      if(inQuotes){
        if(c === '"'){
          if(text[i+1] === '"'){ field += '"'; i++; }
          else inQuotes = false;
        } else field += c;
      } else {
        if(c === '"') inQuotes = true;
        else if(c === ','){ row.push(field); field = ""; }
        else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
        else if(c === '\r'){ /* skip */ }
        else field += c;
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows;
  }

  function notifGetCol(obj, names){
    for(const n of names){
      for(const k in obj){
        if(k.trim().toLowerCase() === n.toLowerCase()) return (obj[k] || "").trim();
      }
    }
    return "";
  }

  function notifParseDate(str){
    if(!str) return null;
    const d = new Date(str);
    return isNaN(d.getTime()) ? null : d;
  }

  function notifBuildFromRows(rows){
    if(!rows.length) return [];
    const header = rows[0].map(h => h.trim());
    const items = [];
    for(let i = 1; i < rows.length; i++){
      const cols = rows[i];
      if(!cols || (cols.length === 1 && !cols[0].trim())) continue;
      const obj = {};
      header.forEach((h, idx) => obj[h] = cols[idx] !== undefined ? cols[idx] : "");
      if(Object.values(obj).every(v => !String(v).trim())) continue;

      const idRaw = notifGetCol(obj, ["ID","Id"]);
      const dateRaw = notifGetCol(obj, ["Date","التاريخ"]);
      const titleCol = notifGetCol(obj, ["Title","العنوان"]);
      const categoryCol = notifGetCol(obj, ["Category","الفئة","Team"]);
      const descCol = notifGetCol(obj, ["Short Description","Description","الوصف"]);
      const statusCol = notifGetCol(obj, ["Status","الحالة"]);
      const updateCol = notifGetCol(obj, ["Update","التحديث"]);
      const imageCol = notifGetCol(obj, ["Image URL","Image","صورة"]);

      let title = titleCol, category = categoryCol, description = descCol;
      let fullContent = updateCol;

      if((!title || !category) && updateCol){
        const lines = updateCol.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        if(!category && lines.length > 1) category = lines[0];
        if(!title) title = lines.length > 1 ? lines[1] : (lines[0] || "");
        if(!description) description = lines.length > 2 ? lines.slice(2).join(" ") : "";
      }
      if(!title) title = "تحديث بدون عنوان";
      if(!category) category = "عام";
      if(!description) description = (updateCol || "").slice(0, 140);
      if(!fullContent) fullContent = [category, title, description].filter(Boolean).join("\n");

      const id = idRaw || (dateRaw ? (dateRaw + "-" + i) : ("notif-" + i));
      items.push({
        id: String(id),
        title, category, description, fullContent,
        status: statusCol,
        important: /important/i.test(statusCol),
        imageUrl: imageCol,
        dateRaw,
        dateObj: notifParseDate(dateRaw)
      });
    }
    return items;
  }

  /* ---------------- fetching ---------------- */
  function notifShowState(message, isWarning){
    const list = document.getElementById("notif-list");
    if(!list) return;
    list.innerHTML = "";
    list.appendChild(el("div",{class:"notif-empty" + (isWarning ? " notif-empty-warning" : "")}, message));
  }

  async function notifTryFetch(url, opts){
    const res = await fetch(url, opts);
    if(!res.ok) throw new Error("HTTP " + res.status + " " + res.statusText);
    const text = await res.text();
    if(!text || !text.trim()) throw new Error("Empty response body");
    return text;
  }

  async function notifFetchData(){
    // A page opened as file://...html cannot fetch a remote URL — this is a
    // browser security restriction with no client-side workaround. Say so
    // plainly instead of showing a generic, misleading "failed to load".
    if(location.protocol === "file:"){
      console.warn(
        "Notifications: this page is open as a local file (file://). " +
        "Browsers block fetch() to remote servers from local files, so the " +
        "Updates section cannot reach the Google Sheet in this mode. " +
        "Serve this same HTML file over http/https (any static web server — " +
        "e.g. `python -m http.server` in this folder, GitHub Pages, an " +
        "intranet file server, etc.) and the live updates will work exactly " +
        "as built, with no code changes."
      );
      if(!NOTIF_LOADED_ONCE){
        notifShowState(
          "التحديثات المباشرة غير متاحة عند فتح الملف مباشرة من جهازك (file://). " +
          "هذا قيد أماني من المتصفح نفسه وليس عطلاً في الصفحة. لتفعيل التحديثات " +
          "التلقائية من الجوجل شيت، يجب تشغيل هذا الملف عبر خادم ويب (http/https) " +
          "بدلاً من فتحه مباشرة من الملفات — نفس الملف الواحد، بدون أي تعديل.",
          true
        );
      }
      return;
    }

    let text = null, lastErr = null;

    // Attempt 1: the sheet URL exactly as published, no modifications
    // (extra query params can break Google's internal redirect / CORS headers).
    try{
      text = await notifTryFetch(NOTIF_SHEET_URL, {cache:"no-store"});
    }catch(e1){
      lastErr = e1;
      console.warn("Notifications: primary fetch failed —", e1.message || e1);
      // Attempt 2: fallback without cache option, in case the browser/proxy
      // rejects the no-store fetch (rare, but seen with some corporate proxies).
      try{
        text = await notifTryFetch(NOTIF_SHEET_URL, {});
      }catch(e2){
        lastErr = e2;
        console.error("Notifications: fallback fetch also failed —", e2.message || e2);
      }
    }

    if(text === null){
      // We only reach here when the page IS served over http/https (the
      // file:// case already returned above), so this is a real network /
      // publish-setting problem, not a local-file limitation.
      console.error(
        "Notifications: could not load the Google Sheet CSV even though this " +
        "page is served over " + location.protocol + "\n" +
        "URL: " + NOTIF_SHEET_URL + "\n" +
        "Last error: " + (lastErr ? (lastErr.message || lastErr) : "unknown") + "\n" +
        "Likely causes: (1) the sheet/tab is not actually Published to the web " +
        "(Google Sheets → File → Share → Publish to web → select the tab → " +
        "CSV → Publish) — link-sharing alone is not enough; (2) a network, " +
        "ad-blocker, or proxy is blocking requests to docs.google.com."
      );
      if(!NOTIF_LOADED_ONCE){
        notifShowState("تعذر تحميل التحديثات حالياً", true);
      }
      return;
    }

    try{
      const rows = notifParseCSV(text);
      const items = notifBuildFromRows(rows);
      items.sort((a,b)=>{
        const ta = a.dateObj ? a.dateObj.getTime() : 0;
        const tb = b.dateObj ? b.dateObj.getTime() : 0;
        return tb - ta;
      });
      const prevUnread = NOTIF_LOADED_ONCE ? notifUnreadCount() : -1;
      NOTIF_DATA = items;
      notifRender();
      if(NOTIF_LOADED_ONCE && prevUnread >= 0){
        const newUnread = notifUnreadCount();
        if(newUnread > prevUnread) notifRingBell();
      }
      NOTIF_LOADED_ONCE = true;
    }catch(e){
      console.error("Notifications: failed to parse CSV", e);
      if(!NOTIF_LOADED_ONCE){
        notifShowState("تعذر تحميل التحديثات حالياً", true);
      }
    }
  }

  function notifRingBell(){
    const bell = document.getElementById("notif-bell-btn");
    if(!bell) return;
    bell.classList.remove("ringing");
    void bell.offsetWidth;
    bell.classList.add("ringing");
    setTimeout(()=>bell.classList.remove("ringing"), 450);
  }

  /* ---------------- derived state ---------------- */
  function notifIsNew(item){
    if(!item.dateObj) return false;
    const diffDays = (Date.now() - item.dateObj.getTime()) / (1000*60*60*24);
    return diffDays >= -1 && diffDays <= 7;
  }
  function notifUnreadCount(){
    return NOTIF_DATA.filter(n => !NOTIF_READ_IDS.has(n.id)).length;
  }

  /* ---------------- rendering ---------------- */
  function notifRenderBadge(){
    const badge = document.getElementById("notif-badge");
    if(!badge) return;
    const count = notifUnreadCount();
    if(count > 0){
      badge.textContent = count > 99 ? "99+" : String(count);
      badge.style.display = "flex";
    } else {
      badge.style.display = "none";
    }
  }

  function notifMatchesDateFilter(item){
    if(!NOTIF_DATE_FROM && !NOTIF_DATE_TO) return true;
    if(!item.dateObj) return false;
    const t = item.dateObj.getTime();
    if(NOTIF_DATE_FROM && t < NOTIF_DATE_FROM.getTime()) return false;
    if(NOTIF_DATE_TO && t > NOTIF_DATE_TO.getTime()) return false;
    return true;
  }
  function notifMatchesTextFilter(item){
    if(!NOTIF_TEXT_QUERY) return true;
    const haystack = [item.title, item.category, item.description, item.fullContent, item.dateRaw]
      .filter(Boolean).join(" ").toLowerCase();
    return haystack.includes(NOTIF_TEXT_QUERY);
  }
  function notifMatchesFilters(item){
    return notifMatchesDateFilter(item) && notifMatchesTextFilter(item);
  }

  function notifRenderList(){
    const list = document.getElementById("notif-list");
    if(!list) return;
    list.innerHTML = "";
    if(!NOTIF_DATA.length){
      list.appendChild(el("div",{class:"notif-empty"}, "لا توجد تحديثات حالياً"));
      return;
    }
    const filtered = NOTIF_DATA.filter(notifMatchesFilters);
    if(!filtered.length){
      list.appendChild(el("div",{class:"notif-empty"}, "لا توجد تحديثات مطابقة للبحث"));
      return;
    }
    const sorted = [...filtered].sort((a,b)=>{
      if(a.important !== b.important) return a.important ? -1 : 1;
      const ta = a.dateObj ? a.dateObj.getTime() : 0;
      const tb = b.dateObj ? b.dateObj.getTime() : 0;
      return tb - ta;
    });
    sorted.forEach(item=>{
      const unread = !NOTIF_READ_IDS.has(item.id);
      const row = el("button",{class:"notif-item" + (unread?" unread":""), type:"button", onclick:()=>notifOpenModal(item)},
        el("div",{class:"notif-item-top"},
          el("span",{class:"notif-item-cat"}, item.category),
          notifIsNew(item) ? el("span",{class:"notif-item-tag notif-tag-new"}, "جديد") : null,
          item.important ? el("span",{class:"notif-item-tag notif-tag-important"}, "هام") : null
        ),
        el("div",{class:"notif-item-title"}, item.title),
        item.description ? el("div",{class:"notif-item-desc"}, item.description) : null,
        el("div",{class:"notif-item-date"}, item.dateRaw || "")
      );
      if(unread) row.appendChild(el("span",{class:"notif-dot"}));
      list.appendChild(row);
    });
  }

  function notifRender(){
    notifRenderBadge();
    notifRenderList();
  }

  /* ---------------- modal ---------------- */
  function notifOpenModal(item){
    if(!NOTIF_READ_IDS.has(item.id)){
      NOTIF_READ_IDS.add(item.id);
      notifSaveReadIds();
      notifRender();
    }
    const overlay = document.getElementById("notif-modal-overlay");
    const box = document.getElementById("notif-modal-box");
    if(!overlay || !box) return;
    box.innerHTML = "";
    box.appendChild(el("div",{class:"notif-modal-head"},
      el("span",{class:"notif-item-cat"}, item.category),
      item.important ? el("span",{class:"notif-item-tag notif-tag-important"}, "هام") : null,
      el("button",{class:"notif-modal-close", type:"button", onclick:notifCloseModal, "aria-label":"إغلاق"}, "✕")
    ));
    box.appendChild(el("h3",{class:"notif-modal-title"}, item.title));
    box.appendChild(el("div",{class:"notif-modal-date"}, item.dateRaw || ""));
    const body = el("div",{class:"notif-modal-body"});
    const contentLines = (item.fullContent || item.description || "").split(/\r?\n/).filter(l=>l.trim());
    if(contentLines.length){
      contentLines.forEach(line => body.appendChild(el("p",null,line)));
    } else {
      body.appendChild(el("p",null,"لا يوجد محتوى إضافي."));
    }
    box.appendChild(body);
    if(item.imageUrl){
      box.appendChild(el("img",{class:"notif-modal-image", src:item.imageUrl, alt:item.title}));
    }
    overlay.classList.add("open");
    document.body.classList.add("notif-modal-open");
  }
  function notifCloseModal(){
    const overlay = document.getElementById("notif-modal-overlay");
    if(overlay) overlay.classList.remove("open");
    document.body.classList.remove("notif-modal-open");
  }

  /* ---------------- panel toggling ---------------- */
  function notifTogglePanel(){
    const panel = document.getElementById("notif-panel");
    if(panel) panel.classList.toggle("open");
  }
  function notifClosePanel(){
    const panel = document.getElementById("notif-panel");
    if(panel) panel.classList.remove("open");
  }

  function notifMarkAllRead(){
    NOTIF_DATA.forEach(item => NOTIF_READ_IDS.add(item.id));
    notifSaveReadIds();
    notifRender();
  }

  /* ---------------- init ---------------- */
  function notifInit(){
    const bell = document.getElementById("notif-bell-btn");
    const panel = document.getElementById("notif-panel");
    const closeBtn = document.getElementById("notif-panel-close");
    const markAllBtn = document.getElementById("notif-mark-all");
    const overlay = document.getElementById("notif-modal-overlay");
    const dateFromInput = document.getElementById("notif-date-from");
    const dateToInput = document.getElementById("notif-date-to");
    const dateClearBtn = document.getElementById("notif-date-clear");
    const textSearchInput = document.getElementById("notif-text-search");
    if(!bell || !panel) return;

    notifLoadReadIds();

    bell.addEventListener("click", (e)=>{ e.stopPropagation(); notifTogglePanel(); });
    if(closeBtn) closeBtn.addEventListener("click", (e)=>{ e.stopPropagation(); notifClosePanel(); });
    if(markAllBtn) markAllBtn.addEventListener("click", (e)=>{ e.stopPropagation(); notifMarkAllRead(); });

    if(textSearchInput){
      textSearchInput.addEventListener("click", (e)=>e.stopPropagation());
      textSearchInput.addEventListener("input", ()=>{
        NOTIF_TEXT_QUERY = textSearchInput.value.trim().toLowerCase();
        notifRenderList();
      });
    }
    if(dateFromInput){
      dateFromInput.addEventListener("click", (e)=>e.stopPropagation());
      dateFromInput.addEventListener("change", ()=>{
        NOTIF_DATE_FROM = dateFromInput.value ? new Date(dateFromInput.value + "T00:00:00") : null;
        notifRenderList();
      });
    }
    if(dateToInput){
      dateToInput.addEventListener("click", (e)=>e.stopPropagation());
      dateToInput.addEventListener("change", ()=>{
        NOTIF_DATE_TO = dateToInput.value ? new Date(dateToInput.value + "T23:59:59") : null;
        notifRenderList();
      });
    }
    if(dateClearBtn){
      dateClearBtn.addEventListener("click", (e)=>{
        e.stopPropagation();
        NOTIF_DATE_FROM = null;
        NOTIF_DATE_TO = null;
        NOTIF_TEXT_QUERY = "";
        if(dateFromInput) dateFromInput.value = "";
        if(dateToInput) dateToInput.value = "";
        if(textSearchInput) textSearchInput.value = "";
        notifRenderList();
      });
    }

    document.addEventListener("click", (e)=>{
      if(panel.classList.contains("open") && !panel.contains(e.target) && e.target !== bell && !bell.contains(e.target)){
        notifClosePanel();
      }
    });

    if(overlay){
      overlay.addEventListener("click", (e)=>{
        if(e.target === overlay) notifCloseModal();
      });
    }

    document.addEventListener("keydown", (e)=>{
      if(e.key === "Escape"){ notifClosePanel(); notifCloseModal(); }
    });

    notifFetchData();
    setInterval(notifFetchData, NOTIF_REFRESH_MS);
  }

  document.addEventListener("DOMContentLoaded", notifInit);
})();
</script>

        s.onload = function(){ window.XLSX ? resolve() : next(); };
        s.onerror = function(){ s.remove(); next(); };
        document.head.appendChild(s);
      })();
    });
    return libPromise;
  }
  function getWorkbook(){
    return loadLib().then(function(){
      return fetch(FILE + "?v=" + Date.now(), { cache:"no-store" });
    }).then(function(res){
      if(!res.ok) throw new Error("http " + res.status);
      return res.arrayBuffer();
    }).then(function(buf){
      return window.XLSX.read(new Uint8Array(buf), { type:"array" });
    });
  }

  /* ---------- sheet -> table model ---------- */
  function cellInfo(cell){
    if(!cell) return null;
    var t = (cell.w !== undefined && cell.w !== null) ? String(cell.w) : (cell.v !== undefined && cell.v !== null ? String(cell.v) : "");
    t = t.replace(/\r\n?/g,"\n").trim();
    var link = (cell.l && cell.l.Target && isHttp(String(cell.l.Target).trim())) ? String(cell.l.Target).trim() : null;
    if(!t && !link) return null;
    return { t:t, link:link };
  }
  function colLetter(c){ return window.XLSX.utils.encode_col(c); }

  function modelFromData(rows){
    function cell(x){ if(x===null||x===undefined||x==="") return null; return Array.isArray(x) ? { t:x[0], link:x[1] } : { t:x, link:null }; }
    var headers = (rows[0]||[]).map(function(x){ return x===null||x===undefined ? "" : (Array.isArray(x)?x[0]:x); });
    var body = rows.slice(1).map(function(r){ var o=[]; for(var i=0;i<headers.length;i++) o.push(cell(r[i])); return o; });
    return { headers:headers, rows:body };
  }
  function buildModel(ws){
    var X = window.XLSX;
    if(!ws || !ws["!ref"]) return { headers:[], rows:[] };
    var rng = X.utils.decode_range(ws["!ref"]);
    var grid = [];
    for(var r = rng.s.r; r <= rng.e.r; r++){
      var row = [], any = false;
      for(var c = rng.s.c; c <= rng.e.c; c++){
        var ci = cellInfo(ws[X.utils.encode_cell({ r:r, c:c })]);
        if(ci) any = true;
        row.push(ci);
      }
      grid.push(any ? row : null);
    }
    var firstIdx = -1;
    for(var i = 0; i < grid.length; i++){ if(grid[i]){ firstIdx = i; break; } }
    if(firstIdx < 0) return { headers:[], rows:[] };
    var head = grid[firstIdx], body = grid.slice(firstIdx + 1).filter(Boolean);
    var ncol = rng.e.c - rng.s.c + 1, keep = [];
    for(var k = 0; k < ncol; k++){
      var has = !!head[k];
      if(!has) body.some(function(row){ return !!row[k] && (has = true); });
      if(has) keep.push(k);                 /* any column that holds data is kept, so nothing added to Excel is lost */
    }
    var headers = keep.map(function(k){ return head[k] ? head[k].t : "Column " + colLetter(rng.s.c + k); });
    var rows = body.map(function(row){ return keep.map(function(k){ return row[k]; }); })
                   .filter(function(row){ return row.some(Boolean); });
    return { headers:headers, rows:rows };
  }

  function findSnapshot(cfg){
    var hit = null;
    DATA.forEach(function(d){ if(!hit && cfg.names.indexOf(normName(d[0])) !== -1) hit = d; });
    return hit;
  }
  function loadSnapshot(){
    SHEETS.forEach(function(cfg){
      var hit = findSnapshot(cfg);
      state.models[cfg.key] = hit ? modelFromData(hit[1]) : null;
    });
    state.source = "snapshot";
    buildIndex();
  }
  function modelSig(m){
    if(!m) return "";
    var n = 0; m.rows.forEach(function(r){ r.forEach(function(c){ if(c) n += c.t.length + (c.link ? c.link.length : 0); }); });
    return m.headers.join("|") + "#" + m.rows.length + "#" + n;
  }

  /* Re-read Process.xlsx. Silent on failure: the previous data stays. */
  function refreshLive(force){
    if(!force && state.livePromise && (Date.now() - state.liveTime) < REFRESH_MS) return state.livePromise;
    state.liveTime = Date.now();
    var p = getWorkbook().then(function(wb){
      var found = 0, models = {};
      SHEETS.forEach(function(cfg){
        var name = null;
        wb.SheetNames.forEach(function(sn){ if(!name && cfg.names.indexOf(normName(sn)) !== -1) name = sn; });
        if(name){ models[cfg.key] = buildModel(wb.Sheets[name]); found++; }
        else models[cfg.key] = state.models[cfg.key];
      });
      if(!found) return false;
      var before = state.active ? modelSig(state.models[state.active]) : "";
      state.models = models; state.source = "live";
      buildIndex();
      if(state.active && isOpen() && modelSig(models[state.active]) !== before) showActive(true);
      return true;
    }).catch(function(){ return false; }).then(function(ok){
      var gi = document.getElementById("top-search");
      if(ok && gi && gi.value.trim()) appendGlobal();
      return ok;
    });
    state.livePromise = p;
    return p;
  }

  /* ---------- cell rendering (URLs clickable, never altered) ---------- */
  function anchor(href, text, cls){
    var a = h("a", cls || "", text);
    a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer";
    return a;
  }
  function fillCell(td, info){
    if(!info) return;
    var t = info.t;
    if(info.link && !isHttp(t)){            /* display text differs from target: link the text */
      td.appendChild(anchor(info.link, t));
      return;
    }
    var re = /https?:\/\/[^\s<>"']+/gi, last = 0, m;
    while((m = re.exec(t)) !== null){
      var url2 = m[0], tail = "";
      var trail = url2.match(/[.,;:!?)\]\u060C\u061B]+$/);
      if(trail){ tail = trail[0]; url2 = url2.slice(0, url2.length - tail.length); }
      if(m.index > last) td.appendChild(document.createTextNode(t.slice(last, m.index)));
      td.appendChild(anchor(url2, url2));
      last = m.index + url2.length;
      re.lastIndex = last;
    }
    if(last < t.length) td.appendChild(document.createTextNode(t.slice(last)));
  }

  function isArabicSheet(rows){
    var ar = 0, all = 0;
    rows.forEach(function(row){ row.forEach(function(ci){
      if(!ci) return;
      var a = ci.t.match(/[\u0600-\u06FF]/g), l = ci.t.match(/[A-Za-z\u0600-\u06FF]/g);
      ar += a ? a.length : 0; all += l ? l.length : 0;
    }); });
    return all > 0 && ar / all > 0.4;
  }
  /* English header kept; Arabic translation added next to "Probation" */
  function headerText(t){
    if(/probation/i.test(t) && t.indexOf("\u0641\u062A\u0631\u0629 \u062A\u062F\u0631\u064A\u0628\u064A\u0629") === -1) return t + " \u2014 \u0641\u062A\u0631\u0629 \u062A\u062F\u0631\u064A\u0628\u064A\u0629";
    return t;
  }

  function renderTable(model){
    elScroll.textContent = "";
    if(!model || !model.rows.length){ setStatus("This sheet has no data.", false); return; }
    var table = h("table", "xl-table");
    table.dir = isArabicSheet(model.rows) ? "rtl" : "ltr";
    elScroll.dir = table.dir;          /* scroll starts at the first column */
    var thead = h("thead"), trh = h("tr");
    model.headers.forEach(function(t){ trh.appendChild(h("th", "", headerText(t))); });
    thead.appendChild(trh); table.appendChild(thead);
    var tbody = h("tbody");
    state.rows = [];
    model.rows.forEach(function(row){
      var tr = h("tr"), hay = [];
      row.forEach(function(ci){
        var td = h("td", "");
        td.dir = "auto";
        fillCell(td, ci);
        if(ci){ hay.push(ci.t); if(ci.link && ci.link !== ci.t) hay.push(ci.link); }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
      state.rows.push({ tr:tr, hay:normSearch(hay.join(" \n ")) });
    });
    table.appendChild(tbody);
    elScroll.appendChild(table);
    applySearch();
  }

  function setStatus(msg, isErr){
    elScroll.textContent = "";
    var d = h("div", "xl-status" + (isErr ? " err" : ""), msg);
    elScroll.appendChild(d);
    elMeta.textContent = "";
  }

  function applySearch(){
    var q = normSearch(elSearch.value).split(/\s+/).filter(Boolean);
    var shown = 0;
    state.rows.forEach(function(r){
      var ok = q.every(function(tok){ return r.hay.indexOf(tok) !== -1; });
      r.tr.style.display = ok ? "" : "none";
      if(ok) shown++;
    });
    var total = state.rows.length;
    elMeta.textContent = q.length ? (shown + " of " + total + " rows") : (total + " rows");
    var old = elScroll.querySelector(".xl-empty");
    if(old) old.remove();
    if(q.length && shown === 0){
      var d = h("div", "xl-status xl-empty", "No matching results.");
      elScroll.appendChild(d);
    }
  }

  /* ---------- open / close / switch ---------- */
  function place(){
    var tb = document.querySelector(".topbar");
    var top = tb ? Math.round(tb.getBoundingClientRect().bottom) : 65;
    var main = document.getElementById("main-content");
    var r = main ? main.getBoundingClientRect() : { left:0, width:window.innerWidth };
    panel.style.top = top + "px";
    panel.style.left = r.left + "px";
    panel.style.width = r.width + "px";
  }
  function isOpen(){ return panel.classList.contains("open"); }

  function setActiveUI(key){
    Object.keys(sbLinks).forEach(function(k){ sbLinks[k].classList.toggle("active", k === key); });
    Object.keys(tabs).forEach(function(k){ tabs[k].classList.toggle("active", k === key); });
  }

  function showActive(keepSearch){
    var cfg = byKey[state.active]; if(!cfg) return;
    var model = state.models[cfg.key];
    var q = keepSearch ? elSearch.value : "";
    elTitle.textContent = "";
    labelInto(elTitle, cfg);
    elSub.textContent = cfg.descEn ? (cfg.descEn + " \u2014 " + cfg.descAr) : ("Sheet: " + cfg.en);
    elSearch.value = q;
    state.sig = modelSig(model);
    if(!model){ setStatus("Sheet \u201C" + cfg.en + "\u201D not found.", true); return; }
    renderTable(model);
  }

  function focusRow(i){
    var r = state.rows[i];
    if(!r) return;
    setTimeout(function(){
      r.tr.scrollIntoView({ block:"center" });
      r.tr.classList.remove("xl-flash"); void r.tr.offsetWidth; r.tr.classList.add("xl-flash");
      setTimeout(function(){ r.tr.classList.remove("xl-flash"); }, 2600);
    }, 60);
  }

  function openSheet(key, forceReload, opts){
    var cfg = byKey[key]; if(!cfg) return;
    document.body.classList.remove("sidebar-open");   /* close the mobile drawer, same as the site does */
    panel.classList.add("open");
    place();
    state.active = key;
    setActiveUI(key);
    showActive(false);
    if(opts && opts.query){
      elSearch.value = opts.query;
      applySearch();
      if(opts.row >= 0) focusRow(opts.row);
    }
    if(forceReload) refreshLive(true);
  }
  function closePanel(){
    panel.classList.remove("open");
    setActiveUI(null);
    state.active = null;
  }

  /* ---------- global search integration (all 4 sheets) ---------- */
  function buildIndex(){
    var idx = [];
    SHEETS.forEach(function(cfg){
      var m = state.models[cfg.key]; if(!m) return;
      idx.push({ cfg:cfg, sheet:true, row:-1, title:labelText(cfg), snip:m.rows.length + " rows",
        tnorm:normSearch(labelText(cfg)),
        hay:normSearch([cfg.en, cfg.ar, cfg.descEn, cfg.descAr, cfg.names.join(" ")].join(" \n ")) });
      m.rows.forEach(function(row, i){
        var parts = [], texts = [];
        row.forEach(function(ci){
          if(!ci) return;
          texts.push(ci);
          parts.push(ci.t);
          if(ci.link && ci.link !== ci.t) parts.push(ci.link);
        });
        if(!texts.length) return;
        var tIdx = 0;
        for(var k = 0; k < texts.length; k++){
          if(!/^[\d\s.,\-]+$/.test(texts[k].t) && !isHttp(texts[k].t)){ tIdx = k; break; }
        }
        var title = (texts[tIdx].t || texts[tIdx].link || "").split("\n")[0].trim();
        var snipParts = [];
        texts.forEach(function(ci, k){
          if(k === tIdx) return;
          var s = ci.t.replace(/\s*\n\s*/g, " ");
          if(s.length > 90 && !/https?:\/\//i.test(s)) s = s.slice(0, 90) + "\u2026";
          if(s) snipParts.push(s);
        });
        idx.push({ cfg:cfg, sheet:false, row:i, title:title, snip:snipParts.join(" \u00B7 "),
          tnorm:normSearch(title), hay:normSearch(parts.join(" \n ")) });
      });
    });
    state.index = idx;
  }

  function xlSearch(q){
    var toks = normSearch(q).split(/\s+/).filter(Boolean);
    if(!toks.length) return [];
    var groups = {};
    state.index.forEach(function(it){
      var score = 0;
      for(var i = 0; i < toks.length; i++){
        if(it.hay.indexOf(toks[i]) === -1) return;
        score += it.tnorm.indexOf(toks[i]) !== -1 ? 3 : 1;
      }
      if(it.sheet) score += 5;
      (groups[it.cfg.key] = groups[it.cfg.key] || []).push({ it:it, score:score });
    });
    var out = [];
    SHEETS.forEach(function(cfg){
      var g = groups[cfg.key]; if(!g) return;
      g.sort(function(a, b){ return b.score - a.score || a.it.row - b.it.row; });
      g.slice(0, PER_SHEET).forEach(function(x){ out.push({ it:x.it }); });
      if(g.length > PER_SHEET) out.push({ more:g.length - PER_SHEET, cfg:cfg });
    });
    return out;
  }

  function highlightInto(node, text, q){
    var terms = q.trim().split(/\s+/).filter(Boolean).map(function(t){ return t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); });
    if(!terms.length){ node.textContent = text; return; }
    var re = new RegExp("(" + terms.join("|") + ")", "gi"), last = 0, m;
    while((m = re.exec(text)) !== null){
      if(m[0] === ""){ re.lastIndex++; continue; }
      if(m.index > last) node.appendChild(document.createTextNode(text.slice(last, m.index)));
      node.appendChild(h("mark", "", m[0]));
      last = m.index + m[0].length;
    }
    if(last < text.length) node.appendChild(document.createTextNode(text.slice(last)));
  }

  function appendGlobal(){
    var input = document.getElementById("top-search");
    var box = document.getElementById("global-search-results");
    var gpanel = document.getElementById("global-search-panel");
    if(!input || !box || !gpanel) return;
    var q = input.value;
    box.querySelectorAll(".xl-sr, .xl-sr-head").forEach(function(n){ n.remove(); });
    if(!q.trim()) return;
    var res = xlSearch(q);
    if(!res.length) return;
    var nr = box.querySelector(".no-results"); if(nr) nr.remove();   /* we do have results */
    box.appendChild(h("div", "xl-sr-head", "Process Data \u2014 \u0628\u064A\u0627\u0646\u0627\u062A \u0627\u0644\u0625\u0643\u0633\u0644"));
    function go(ev, cfg, row){
      ev.stopPropagation();
      input.value = ""; gpanel.classList.remove("open");
      openSheet(cfg.key, false, { query:q, row:row });
    }
    res.forEach(function(r){
      var b;
      if(r.more){
        b = h("button", "search-result-item xl-sr xl-more"); b.type = "button";
        b.appendChild(h("span", "sr-type", labelText(r.cfg)));
        b.appendChild(h("span", "sr-title", "+" + r.more + " more \u2014 \u0639\u0631\u0636 \u0627\u0644\u0628\u0627\u0642\u064A"));
        b.addEventListener("click", function(ev){ go(ev, r.cfg, -1); });
      } else {
        var it = r.it;
        b = h("button", "search-result-item xl-sr"); b.type = "button";
        b.appendChild(h("span", "sr-type", labelText(it.cfg)));
        var ti = h("span", "sr-title"); highlightInto(ti, it.title, q); b.appendChild(ti);
        if(it.snip) b.appendChild(h("span", "sr-snip", it.snip));
        b.addEventListener("click", function(ev){ go(ev, it.cfg, it.row); });
      }
      box.appendChild(b);
    });
  }

  /* ---------- build UI ---------- */
  function init(){
    var sidebar = document.getElementById("sidebar");
    if(!sidebar || document.getElementById("xl-panel")) return;

    loadSnapshot();

    /* sidebar block: the ONLY place the sheet icons appear */
    var block = h("div", "xl-sb"); block.id = "xl-sidebar-block";
    var title = h("div", "xl-sb-title");
    title.appendChild(document.createTextNode("\uD83D\uDCCA Process Data"));
    block.appendChild(title);
    var list = h("div", "xl-sb-list");
    SHEETS.forEach(function(cfg){
      var b = h("button", "xl-link"); b.type = "button";
      var ic = h("span", "xl-ico"); ic.innerHTML = cfg.icon;
      var lb = labelInto(h("span", "xl-lb"), cfg);
      b.appendChild(ic); b.appendChild(lb);
      b.addEventListener("click", function(){ openSheet(cfg.key); });
      sbLinks[cfg.key] = b; list.appendChild(b);
    });
    block.appendChild(list);
    sidebar.appendChild(block);

    /* panel (overlay above the main content) - text only, no icons */
    panel = h("section", "xl-panel"); panel.id = "xl-panel";
    panel.setAttribute("aria-label", "Process data");
    var head = h("div", "xl-head");
    var tl = h("div", "xl-title");
    elTitle = h("h2"); elSub = h("div", "xl-sub");
    tl.appendChild(elTitle); tl.appendChild(elSub);
    var tools = h("div", "xl-tools");
    var sw = h("div", "xl-search");
    elSearch = document.createElement("input");
    elSearch.type = "search"; elSearch.id = "xl-search";
    elSearch.placeholder = "\u0628\u062D\u062B / Search in this sheet\u2026";
    elSearch.setAttribute("aria-label", "Search in this sheet");
    elSearch.autocomplete = "off";
    var tmr = null;
    elSearch.addEventListener("input", function(){ clearTimeout(tmr); tmr = setTimeout(applySearch, 120); });
    sw.appendChild(elSearch); sw.appendChild(h("span", "", "\uD83D\uDD0D"));
    var rf = h("button", "xl-btn", "\u21BB"); rf.type = "button"; rf.title = "Reload data from " + FILE; rf.setAttribute("aria-label", "Reload data");
    rf.addEventListener("click", function(){ if(state.active) refreshLive(true); });
    var cl = h("button", "xl-btn", "\u2715"); cl.type = "button"; cl.title = "Close"; cl.setAttribute("aria-label", "Close");
    cl.addEventListener("click", closePanel);
    tools.appendChild(sw); tools.appendChild(rf); tools.appendChild(cl);
    head.appendChild(tl); head.appendChild(tools);

    var tabBar = h("div", "xl-tabs"); tabBar.setAttribute("role", "tablist");
    SHEETS.forEach(function(cfg){
      var b = h("button", "xl-tab"); b.type = "button";
      b.appendChild(labelInto(h("span", ""), cfg));
      b.addEventListener("click", function(){ openSheet(cfg.key); });
      tabs[cfg.key] = b; tabBar.appendChild(b);
    });

    var body = h("div", "xl-body");
    elMeta = h("div", "xl-meta"); elMeta.dir = "ltr"; elMeta.style.textAlign = "start"; elScroll = h("div", "xl-scroll");
    body.appendChild(elMeta); body.appendChild(elScroll);

    panel.appendChild(head); panel.appendChild(tabBar); panel.appendChild(body);
    document.body.appendChild(panel);

    /* keep the overlay aligned + let the site's own navigation take over again */
    window.addEventListener("resize", function(){ if(isOpen()) place(); });
    document.addEventListener("keydown", function(e){ if(e.key === "Escape" && isOpen()) closePanel(); });
    sidebar.addEventListener("click", function(e){
      var nav = document.getElementById("sidebar-nav");
      if(isOpen() && nav && nav.contains(e.target)) closePanel();
    });
    var logo = document.querySelector(".logo-box");
    if(logo) logo.addEventListener("click", function(){ if(isOpen()) closePanel(); });

    /* global search: add rows from all 4 sheets under the site's own results */
    var gs = document.getElementById("global-search-results");
    if(gs) gs.addEventListener("click", function(){ if(isOpen()) closePanel(); });   /* a site result was chosen */
    var ti = document.getElementById("top-search");
    if(ti){
      ["input", "focus"].forEach(function(evn){
        ti.addEventListener(evn, function(){
          setTimeout(appendGlobal, 0);                                   /* after the site renders its own results */
          if(Date.now() - state.liveTime > REFRESH_MS) refreshLive(false);  /* pick up newly added Excel rows */
        });
      });
    }

    refreshLive(false);        /* read the live Process.xlsx in the background */
  }

  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
