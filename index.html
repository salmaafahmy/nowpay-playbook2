<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوابة معرفة NowPay | Knowledge Portal</title>
<meta name="description" content="بوابة المعرفة الداخلية لخدمة عملاء NowPay">
<style>
/* ===================== Design tokens ===================== */
:root{
  --teal-dark: #0F4746;
  --teal-dark2: #0B3F3E;
  --green: #35A854;
  --green-light: #6FCF97;
  --bg: #F6FAFA;
  --bg2: #EAF5F3;
  --card: #FFFFFF;
  --border: #DCECEC;
  --text: #123B4A;
  --text2: #5F7A82;
  --radius: 14px;
  --radius-sm: 9px;
  --shadow-sm: 0 1px 3px rgba(15,71,70,.06), 0 1px 2px rgba(15,71,70,.08);
  --shadow-md: 0 8px 24px rgba(15,71,70,.10);
  --shadow-lg: 0 16px 40px rgba(15,71,70,.16);
  --sidebar-w: 292px;
}

*{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
body{
  margin:0;
  font-family:"Segoe UI","Tahoma","Cairo","Geeza Pro",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  direction:rtl;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
::selection{ background:var(--green-light); color:var(--teal-dark2); }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:#C7DEDD; border-radius:10px; }
::-webkit-scrollbar-thumb:hover{ background:#AFCFCD; }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001ms !important; transition-duration:.001ms !important; scroll-behavior:auto !important; }
}

a{ color:inherit; }
button{ font-family:inherit; cursor:pointer; }
mark{ background:#FFE79A; color:#5A4300; padding:0 2px; border-radius:3px; }

/* ===================== Top bar ===================== */
.topbar{
  position:sticky; top:0; z-index:60;
  background:linear-gradient(90deg, var(--teal-dark2), var(--teal-dark));
  color:#fff;
  box-shadow:var(--shadow-md);
}
.topbar-inner{
  max-width:1600px; margin:0 auto;
  display:flex; align-items:center; gap:16px;
  padding:12px 20px;
}
.logo-box{
  display:flex; align-items:center; gap:10px; flex-shrink:0;
}
.logo-mark{
  width:38px; height:38px; border-radius:10px;
  background:linear-gradient(135deg, var(--green), var(--green-light));
  display:flex; align-items:center; justify-content:center;
  font-weight:800; color:#0B3F3E; font-size:16px;
  box-shadow:var(--shadow-sm);
}
.logo-text{ display:flex; flex-direction:column; line-height:1.15; }
.logo-title{ font-weight:800; font-size:16px; }
.logo-sub{ font-size:11px; color:#BFE3DF; }

.menu-toggle{
  display:none;
  background:rgba(255,255,255,.12); border:none; color:#fff;
  width:38px; height:38px; border-radius:10px; font-size:18px;
  align-items:center; justify-content:center;
}

.top-search-wrap{ position:relative; flex:1; max-width:640px; margin:0 auto; }
.top-search{
  width:100%; padding:10px 42px 10px 14px; border-radius:999px;
  border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.12);
  color:#fff; font-size:14px; outline:none; transition:.2s;
}
.top-search::placeholder{ color:#CFE9E6; }
.top-search:focus{ background:#fff; color:var(--text); box-shadow:0 0 0 3px rgba(111,207,151,.35); }
.top-search:focus::placeholder{ color:#9BB7BD; }
.top-search-icon{
  position:absolute; right:14px; top:50%; transform:translateY(-50%);
  font-size:15px; color:#CFE9E6; pointer-events:none;
}
.top-search:focus + .top-search-icon{ color:var(--text2); }

.last-updated{
  font-size:12px; color:#CFE9E6; white-space:nowrap; flex-shrink:0;
}
.last-updated b{ color:#fff; font-weight:600; }

.global-search-panel{
  position:absolute; top:calc(100% + 8px); right:0; left:0;
  background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow-lg);
  border:1px solid var(--border);
  max-height:0; overflow:hidden; opacity:0;
  transition:max-height .22s ease, opacity .18s ease;
  z-index:80;
}
.global-search-panel.open{ max-height:60vh; overflow-y:auto; opacity:1; }
#global-search-results{ padding:6px; }

.search-result-item{
  display:flex; align-items:center; gap:10px; width:100%;
  text-align:right; background:none; border:none; padding:10px 12px;
  border-radius:var(--radius-sm); font-size:13.5px; color:var(--text);
}
.search-result-item:hover{ background:var(--bg2); }
.sr-type{
  background:var(--bg2); color:var(--teal-dark); font-size:11px; padding:3px 8px;
  border-radius:999px; flex-shrink:0; font-weight:700;
}
.sr-title{ font-weight:600; flex:1; }
.sr-snip{ color:var(--text2); font-size:11.5px; flex-shrink:0; max-width:35%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.no-results{ padding:20px; text-align:center; color:var(--text2); font-size:13.5px; }

/* ===================== Notifications ===================== */
.notif-bell-wrap{ position:relative; flex-shrink:0; }
.notif-bell-btn{
  position:relative; background:rgba(255,255,255,.12); border:none; color:#fff;
  width:38px; height:38px; border-radius:10px; font-size:17px;
  display:flex; align-items:center; justify-content:center; transition:.2s;
}
.notif-bell-btn:hover{ background:rgba(255,255,255,.22); }
.notif-bell-btn.ringing{ animation:notifRing .4s ease; }
@keyframes notifRing{
  0%,100%{ transform:rotate(0); }
  20%{ transform:rotate(-14deg); }
  40%{ transform:rotate(12deg); }
  60%{ transform:rotate(-8deg); }
  80%{ transform:rotate(6deg); }
}
.notif-badge{
  position:absolute; top:-4px; left:-4px; min-width:18px; height:18px; padding:0 4px;
  background:#E14B4B; color:#fff; font-size:10.5px; font-weight:800; border-radius:999px;
  display:none; align-items:center; justify-content:center; box-shadow:0 0 0 2px var(--teal-dark2);
  line-height:1;
}
.notif-panel{
  position:absolute; top:calc(100% + 10px); left:0; width:380px; max-width:90vw;
  background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow-lg);
  border:1px solid var(--border); max-height:0; overflow:hidden; opacity:0;
  transform:translateY(-6px);
  transition:max-height .25s ease, opacity .2s ease, transform .2s ease;
  z-index:90;
}
.notif-panel.open{ max-height:70vh; opacity:1; transform:translateY(0); overflow-y:auto; }
.notif-panel-head{
  display:flex; align-items:center; justify-content:space-between; padding:14px 16px 10px;
  border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--card); z-index:2;
}
.notif-panel-title{ font-weight:800; font-size:14px; color:var(--teal-dark); }
.notif-panel-actions{ display:flex; align-items:center; gap:6px; }
.notif-mark-all{
  background:none; border:none; color:var(--green); font-size:11.5px; font-weight:700; padding:4px 6px; border-radius:6px;
}
.notif-mark-all:hover{ background:var(--bg2); }
.notif-panel-close-btn{ background:none; border:none; color:var(--text2); font-size:13px; padding:4px 6px; border-radius:6px; }
.notif-panel-close-btn:hover{ background:var(--bg2); color:var(--text); }
.notif-search-row{
  display:flex; align-items:center; gap:6px; padding:8px 10px; border-bottom:1px solid var(--border, #E5EEEC); flex-wrap:wrap;
}
.notif-text-search{
  border:1px solid var(--border, #DDE7E5); border-radius:8px; font-size:12.5px; padding:6px 8px;
  color:var(--text); background:#fff; width:100%; flex:1 1 100%;
}
.notif-text-search::placeholder{ color:var(--text2); }
.notif-search-row .notif-date-field{ display:flex; align-items:center; gap:4px; }
.notif-search-row label{ font-size:11px; color:var(--text2); white-space:nowrap; }
.notif-search-row input[type="date"]{
  border:1px solid var(--border, #DDE7E5); border-radius:8px; font-size:12px; padding:4px 6px;
  color:var(--text); background:#fff; min-width:0; flex:1 1 110px;
}
.notif-search-clear{
  background:var(--bg2); border:none; border-radius:8px; font-size:11.5px; padding:5px 9px; color:var(--text2); white-space:nowrap;
}
.notif-search-clear:hover{ background:#DCECEC; color:var(--text); }
.notif-list{ display:flex; flex-direction:column; padding:6px; }
.notif-item{
  position:relative; display:flex; flex-direction:column; gap:4px; text-align:right; width:100%;
  background:none; border:none; padding:12px 30px 12px 14px; border-radius:var(--radius-sm);
  cursor:pointer; transition:.15s; border-bottom:1px solid var(--border);
}
.notif-item:last-child{ border-bottom:none; }
.notif-item:hover{ background:var(--bg2); }
.notif-item.unread{ background:#F3FBF8; }
.notif-item.unread:hover{ background:var(--bg2); }
.notif-item-top{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.notif-item-cat{ font-size:11px; font-weight:700; color:var(--teal-dark); background:var(--bg2); padding:2px 8px; border-radius:999px; white-space:nowrap; }
.notif-item-tag{ font-size:10.5px; font-weight:800; padding:2px 7px; border-radius:999px; white-space:nowrap; }
.notif-tag-new{ background:#DFF5E6; color:#1E7A3E; }
.notif-tag-important{ background:#FCE1DF; color:#B3261E; }
.notif-item-title{ font-weight:700; font-size:13.5px; color:var(--text); }
.notif-item-desc{
  font-size:12px; color:var(--text2); overflow:hidden; text-overflow:ellipsis;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
}
.notif-item-date{ font-size:11px; color:var(--text2); }
.notif-dot{ position:absolute; top:16px; left:12px; width:8px; height:8px; border-radius:50%; background:var(--green); }
.notif-empty, .notif-loading{ padding:34px 16px; text-align:center; color:var(--text2); font-size:13px; }
.notif-empty-warning{ text-align:right; line-height:1.8; color:var(--text); background:var(--bg2); margin:8px; border-radius:var(--radius-sm); }

.notif-modal-overlay{
  position:fixed; inset:0; background:rgba(11,63,62,.5); z-index:200;
  display:flex; align-items:center; justify-content:center; padding:20px;
  opacity:0; pointer-events:none; transition:opacity .2s ease;
}
.notif-modal-overlay.open{ opacity:1; pointer-events:auto; }
.notif-modal-box{
  background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow-lg);
  max-width:560px; width:100%; max-height:85vh; overflow-y:auto; padding:22px 24px;
  transform:translateY(14px) scale(.97); transition:transform .22s ease;
}
.notif-modal-overlay.open .notif-modal-box{ transform:translateY(0) scale(1); }
.notif-modal-head{ display:flex; align-items:center; gap:8px; margin-bottom:12px; }
.notif-modal-close{ margin-right:auto; background:var(--bg2); border:none; width:28px; height:28px; border-radius:8px; color:var(--text2); font-size:13px; flex-shrink:0; }
.notif-modal-close:hover{ background:#DCECEC; color:var(--text); }
.notif-modal-title{ font-size:17px; font-weight:800; color:var(--teal-dark2); margin:0 0 6px; }
.notif-modal-date{ font-size:12px; color:var(--text2); margin-bottom:14px; }
.notif-modal-body p{ margin:0 0 10px; font-size:13.5px; color:var(--text); line-height:1.75; white-space:pre-wrap; }
.notif-modal-image{ width:100%; border-radius:var(--radius-sm); margin-top:10px; display:block; }
body.notif-modal-open{ overflow:hidden; }

@media (max-width:620px){
  .notif-panel{ width:92vw; }
}

/* ===================== Shell layout ===================== */
.shell{ display:flex; max-width:1600px; margin:0 auto; align-items:flex-start; }

.sidebar{
  width:var(--sidebar-w); flex-shrink:0;
  position:sticky; top:65px;
  height:calc(100vh - 65px);
  overflow-y:auto;
  background:var(--card);
  border-left:1px solid var(--border);
  padding:16px 12px 40px;
}
.sb-group{ margin-bottom:6px; }
.sb-group-head{
  width:100%; display:flex; align-items:center; gap:8px;
  background:none; border:none; padding:9px 8px; border-radius:var(--radius-sm);
  font-weight:700; font-size:13px; color:var(--teal-dark);
}
.sb-group-head:hover{ background:var(--bg2); }
.sb-group-icon{ font-size:15px; }
.sb-group-title{ flex:1; text-align:right; }
.sb-group-caret{ transition:transform .2s; font-size:12px; color:var(--text2); }
.sb-group-head.collapsed .sb-group-caret{ transform:rotate(-90deg); }
.sb-group-body{
  display:flex; flex-direction:column; gap:2px; padding:2px 4px 10px 4px;
  max-height:600px; overflow:hidden; transition:max-height .25s ease;
}
.sb-group-body.collapsed{ max-height:0; padding-top:0; padding-bottom:0; }
.sb-link{
  display:flex; align-items:center; gap:9px; padding:8px 10px 8px 8px;
  border-radius:var(--radius-sm); text-decoration:none; color:var(--text2);
  font-size:13px; transition:.15s; border-right:3px solid transparent;
}
.sb-link:hover{ background:var(--bg2); color:var(--text); }
.sb-link.active{
  background:var(--bg2); color:var(--teal-dark); font-weight:700;
  border-right-color:var(--green);
}
.sb-link-icon{ font-size:14px; flex-shrink:0; }

.sidebar-scrim{ display:none; }

/* ===================== Main content ===================== */
#main-content{
  flex:1; min-width:0; padding:28px 28px 100px;
}

/* ---- Hero ---- */
.hero{
  background:linear-gradient(135deg, var(--teal-dark2), var(--teal-dark) 60%, #124f4d);
  color:#fff; border-radius:20px; padding:38px 32px; margin-bottom:28px;
  box-shadow:var(--shadow-lg);
  position:relative; overflow:hidden;
}
.hero::after{
  content:""; position:absolute; inset:0;
  background:radial-gradient(circle at 85% 20%, rgba(111,207,151,.25), transparent 55%);
  pointer-events:none;
}
.hero-badge{
  display:inline-block; background:rgba(255,255,255,.14); color:#D7F5E5;
  font-size:12px; font-weight:700; padding:5px 12px; border-radius:999px; margin-bottom:14px;
}
.hero h1{ margin:0 0 10px; font-size:28px; font-weight:800; }
.hero-sub{ margin:0 0 20px; color:#CFE9E6; max-width:680px; font-size:14.5px; }
.hero-quick{ display:flex; flex-wrap:wrap; gap:10px; position:relative; z-index:1; }
.hero-quick-btn{
  background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.22); color:#fff;
  padding:9px 16px; border-radius:999px; font-size:13px; font-weight:600; transition:.18s;
}
.hero-quick-btn:hover{ background:var(--green); border-color:var(--green); transform:translateY(-1px); }

/* ---- Category headings ---- */
.cat-heading{
  display:flex; align-items:center; gap:10px;
  font-size:19px; font-weight:800; color:var(--teal-dark);
  margin:34px 0 14px; padding-bottom:8px; border-bottom:2px solid var(--border);
  scroll-margin-top:80px;
}
.cat-heading:first-of-type{ margin-top:8px; }
.cat-heading-icon{ font-size:20px; }

/* ---- Topic card (details/summary) ---- */
.topic-card{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  margin-bottom:14px; box-shadow:var(--shadow-sm); overflow:hidden;
  scroll-margin-top:80px; transition:box-shadow .2s, transform .2s;
}
.topic-card[open]{ box-shadow:var(--shadow-md); }
.topic-card.flash-highlight{ animation:flashRing 2.2s ease; }
@keyframes flashRing{
  0%{ box-shadow:0 0 0 4px rgba(53,168,84,.45), var(--shadow-md); }
  100%{ box-shadow:var(--shadow-sm); }
}
.topic-summary{
  list-style:none; cursor:pointer; padding:18px 20px; display:flex; align-items:center; gap:14px;
  transition:background .15s;
}
.topic-summary::-webkit-details-marker{ display:none; }
.topic-summary:hover{ background:var(--bg2); }
.topic-icon{
  font-size:22px; width:44px; height:44px; flex-shrink:0; border-radius:12px;
  background:var(--bg2); display:flex; align-items:center; justify-content:center;
}
.topic-summary-text{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.topic-title{ font-size:16px; font-weight:800; color:var(--text); }
.topic-cat{ font-size:12px; color:var(--text2); }
.topic-caret{ color:var(--text2); font-size:16px; transition:transform .2s; flex-shrink:0; }
.topic-card[open] .topic-caret{ transform:rotate(180deg); color:var(--green); }

.topic-body{ padding:4px 22px 26px; border-top:1px solid var(--border); }

/* ---- Content blocks ---- */
.block{ margin-top:20px; }
.block-title{ font-size:15px; font-weight:800; color:var(--teal-dark); margin:0 0 10px; }
.block-subheading{ font-size:14px; font-weight:700; color:var(--text); margin:16px 0 6px; }
.block-overview p{ font-size:14.5px; color:var(--text); background:var(--bg2); border-radius:var(--radius-sm); padding:14px 16px; margin:0; }

.bul-list{ margin:0; padding-inline-start:20px; display:flex; flex-direction:column; gap:8px; }
.bul-list li{ font-size:14px; color:var(--text); }

/* step cards */
.step-cards{ display:flex; flex-direction:column; gap:8px; }
.step-card{
  display:flex; align-items:flex-start; gap:12px; background:var(--bg2);
  border-radius:var(--radius-sm); padding:10px 14px; font-size:14px;
}
.step-num{
  flex-shrink:0; width:26px; height:26px; border-radius:50%; background:var(--green);
  color:#fff; font-weight:800; font-size:12.5px; display:flex; align-items:center; justify-content:center;
}
.step-text{ padding-top:2px; }

/* status grid */
.status-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px; }
.status-card{
  background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px 16px;
}
.status-name{ font-weight:800; color:var(--teal-dark); font-size:13.5px; margin-bottom:6px; }
.status-desc{ font-size:13px; color:var(--text2); line-height:1.6; }

/* callouts */
.callout{ border-radius:var(--radius-sm); padding:16px 18px; }
.callout-head{ display:flex; align-items:center; gap:10px; font-weight:800; font-size:13.5px; margin-bottom:10px; color:var(--text); }
.callout-badge{ font-size:11px; padding:4px 10px; border-radius:999px; font-weight:800; }
.badge-note{ background:#FFF3D6; color:#8A5B00; }
.badge-check{ background:#DFF5E6; color:#1E7A3E; }
.callout-check{ background:#F2FBF5; border:1px solid #D3EFDC; }
.callout-note{ background:#FFFBF0; border:1px solid #F5E7BE; }

.check-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
.check-list li{ display:flex; align-items:flex-start; gap:10px; font-size:14px; }
.chk-box{ margin-top:4px; width:16px; height:16px; accent-color:var(--green); flex-shrink:0; }
.chk-label{ cursor:pointer; }
.check-list li.checked .chk-label{ text-decoration:line-through; color:var(--text2); }

/* FAQ accordion */
.faq-acc{ display:flex; flex-direction:column; gap:8px; }
.faq-item{ border:1px solid var(--border); border-radius:var(--radius-sm); overflow:hidden; background:var(--card); }
.faq-q{
  width:100%; display:flex; align-items:center; gap:10px; text-align:right;
  background:var(--bg2); border:none; padding:12px 16px; font-size:14px; font-weight:700; color:var(--text);
}
.faq-q-mark{
  width:22px; height:22px; border-radius:50%; background:var(--teal-dark); color:#fff;
  font-size:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.faq-q-text{ flex:1; }
.faq-caret{ transition:transform .2s; color:var(--text2); }
.faq-q.open .faq-caret{ transform:rotate(180deg); color:var(--green); }
.faq-body{ max-height:0; overflow:hidden; transition:max-height .25s ease; padding:0 16px; }
.faq-body.open{ max-height:900px; padding:14px 16px 16px; }
.faq-body p{ margin:0 0 8px; font-size:13.5px; color:var(--text); white-space:pre-line; }
.video-link{
  display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--teal-dark);
  font-weight:700; text-decoration:none; background:var(--bg2); padding:6px 12px; border-radius:999px;
}
.video-link:hover{ background:var(--green-light); color:#0B3F3E; }

/* videos row */
.video-row{ display:flex; flex-wrap:wrap; gap:10px; }
.video-chip{
  display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:var(--teal-dark);
  background:var(--bg2); padding:8px 14px; border-radius:999px; text-decoration:none; border:1px solid var(--border);
}
.video-chip:hover{ background:var(--green-light); color:#0B3F3E; }

/* related */
.related-block{ border-top:1px dashed var(--border); padding-top:16px; }
.related-row{ display:flex; flex-wrap:wrap; gap:8px; }
.related-pill{
  background:var(--bg2); border:1px solid var(--border); color:var(--teal-dark); font-size:12.5px;
  font-weight:700; padding:7px 14px; border-radius:999px;
}
.related-pill:hover{ background:var(--green); color:#fff; border-color:var(--green); }

/* ---- Tables ---- */
.table-wrap{ display:flex; flex-direction:column; gap:10px; }
.table-toolbar{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.mini-search{
  flex:1; min-width:220px; padding:9px 14px; border-radius:999px; border:1px solid var(--border);
  background:var(--bg2); font-size:13.5px; color:var(--text); outline:none;
}
.mini-search:focus{ border-color:var(--green); background:#fff; }
.table-count{ font-size:12.5px; color:var(--text2); font-weight:600; flex-shrink:0; }
.table-scroll{ overflow:auto; border:1px solid var(--border); border-radius:var(--radius-sm); max-height:420px; }
.table-scroll.tall{ max-height:520px; }
.data-table{ width:100%; border-collapse:collapse; font-size:13px; }
.data-table thead th{
  position:sticky; top:0; background:var(--teal-dark); color:#fff; text-align:right;
  padding:10px 14px; font-weight:700; font-size:12.5px; white-space:nowrap;
}
.data-table tbody td{ padding:9px 14px; border-top:1px solid var(--border); color:var(--text); vertical-align:top; }
.data-table tbody tr:nth-child(even){ background:#FAFDFD; }
.data-table tbody tr:hover{ background:var(--bg2); }
.mono{ font-family:"Consolas","Courier New",monospace; direction:ltr; text-align:left; unicode-bidi:plaintext; }

.badge-fee{ background:var(--bg2); color:var(--teal-dark); font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap; }
.badge-sla{ background:#FFF3D6; color:#8A5B00; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap; }

/* channel / script cards */
.channel-grid, .script-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
.channel-card, .script-card{ background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px 16px; }
.channel-label{ font-size:12px; color:var(--text2); font-weight:700; margin-bottom:6px; }
.channel-value{ font-size:14px; font-weight:700; color:var(--text); word-break:break-word; }
.script-label{ font-size:12.5px; font-weight:800; color:var(--teal-dark); margin-bottom:6px; }
.script-ar{ font-size:13.5px; margin-bottom:6px; white-space:pre-line; }
.script-en{ font-size:12.5px; color:var(--text2); white-space:pre-line; direction:ltr; text-align:left; }

/* action cards (ops-tool actions) */
.action-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:14px; }
.action-card{ background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:16px 18px; }
.action-title{ font-weight:800; font-size:14px; color:var(--teal-dark); margin-bottom:8px; white-space:pre-line; }
.action-meta{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
.chip{ background:#fff; border:1px solid var(--border); font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; color:var(--text2); }
.chip-sla{ background:#FFF3D6; color:#8A5B00; border-color:#F5E7BE; }
.chip-yes{ background:#DFF5E6; color:#1E7A3E; border-color:#C9EAD3; }
.chip-no{ background:#FDE7E7; color:#B23B3B; border-color:#F6CFCF; }
.action-field{ font-size:12.5px; color:var(--text); margin-top:6px; white-space:pre-line; }
.action-field b{ color:var(--teal-dark); }
.ticket-body pre{
  white-space:pre-wrap; background:#fff; border:1px solid var(--border); border-radius:8px;
  padding:10px 12px; font-family:inherit; font-size:12px; margin:6px 0 0; color:var(--text);
}

.muted{ color:var(--text2); font-size:13px; }
.muted.small{ font-size:12px; }

/* ---- Floating top button ---- */
.top-btn-fixed{
  position:fixed; bottom:26px; left:26px; z-index:50;
  width:46px; height:46px; border-radius:50%; background:var(--teal-dark); color:#fff;
  border:none; font-size:18px; box-shadow:var(--shadow-lg);
  display:flex; align-items:center; justify-content:center;
  opacity:0; transform:translateY(10px) scale(.9); pointer-events:none; transition:.25s;
}
.top-btn-fixed.visible{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
.top-btn-fixed:hover{ background:var(--green); }

/* ===================== Responsive ===================== */
@media (max-width: 980px){
  .sidebar{
    position:fixed; top:0; right:0; height:100vh; z-index:120;
    transform:translateX(100%); transition:transform .25s ease; width:82vw; max-width:320px;
    box-shadow:var(--shadow-lg); top:0; padding-top:74px;
  }
  body.sidebar-open .sidebar{ transform:translateX(0); }
  .sidebar-scrim{
    display:none; position:fixed; inset:0; background:rgba(11,63,62,.45); z-index:110;
  }
  body.sidebar-open .sidebar-scrim{ display:block; }
  .menu-toggle{ display:flex; }
  #main-content{ padding:20px 16px 90px; }
  .hero{ padding:26px 20px; }
  .hero h1{ font-size:22px; }
  .last-updated{ display:none; }
}
@media (max-width: 620px){
  .topbar-inner{ flex-wrap:wrap; }
  .top-search-wrap{ order:3; max-width:none; width:100%; }
  .status-grid, .action-grid{ grid-template-columns:1fr; }
  .top-btn-fixed{ left:16px; bottom:16px; }
}

/* print */
@media print{
  .sidebar, .topbar, .top-btn-fixed{ display:none !important; }
  .topic-card{ break-inside:avoid; }
}


/* ---- Added: business-topic section grouping ---- */
.breadcrumb{ font-size:11.5px; color:var(--text2); margin-bottom:3px; display:block; }
.topic-section{ margin-top:22px; padding-top:16px; border-top:1px dashed var(--border); }
.topic-section:first-of-type{ margin-top:6px; padding-top:6px; border-top:none; }
.topic-section-head{
  display:flex; align-items:center; gap:9px; font-size:14.5px; font-weight:800;
  color:var(--teal-dark); margin-bottom:12px;
}
.topic-section-icon{
  width:28px; height:28px; border-radius:8px; background:var(--bg2);
  display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0;
}
.topic-section .block:first-child{ margin-top:0; }
</style>

y place you on hold for a moment while I review your inquiry and make sure I provide you with the correct information?\nI’ll be back with you in about two minutes. Thank you for your patience."}, {"label": "Contact Request for foreign customer", "ar": null, "en": "Thank You For contacting us in order to help you please send your inquire on our email(support@nowpay.com)and we will reply within 1 hour."}, {"label": "Validation", "ar": "يجب التوضيح للعميل انك تحتاج لمراجعه بياناته قبل الرد علي استفساره  يجب مراجعه بعض البيانات قبل الرد علي استفسار حضرتك\nبعد ذلك يجب ان تشكر العميل  شكرا لحضرتك / شكرا لحضرتك لمراجعه البيانات", "en": "I just need to review some of your information before I can answer your inquiry.\n\nThank you for your patience, and I appreciate you taking the time to review the details with me."}, {"label": "Closure", "ar": "هل هناك أي استفسارات أخرى أستطيع مساعدتك بها؟\n(بعد الرد): سعدت بخدمتك اليوم، \"شكراً لتواصلك مع [ناوباي],ونتمنى لك يومًا سعيدًا", "en": "Is there anything else I can assist you with today?\n\n(After the customer responds)\nIt was a pleasure assisting you today.\nThank you for contacting [NowPay], and we wish you a wonderful day!"}, {"label": "Complaint", "ar": "في البداية ، نعتذر لك عن أي مشكلة واجهت حضرتك من (.........) ، أرجو أن تسمح لي بفرصة لمساعدتك ,\nيرجي توضيح المشكله الخاصه بحضرتك حتي اتمكن من مساعده حضرتك", "en": "First of all, I’d like to apologize for any inconvenience you’ve experienced with (…).\nKindly allow me the opportunity to assist you.\n\nCould you kindly explain the issue you’re facing so I can help you further?"}, {"label": "Late response (angry Customer)", "ar": "في البداية ، نعتذر لك عن أي تأخير صدر من خلالنا ,أرجو أن تسمح لي بفرصة لمساعدتك في هذا الأمر", "en": "First of all, I’m sorry for any delay from our side.\nKindly allow me the chance to help you with this."}], "kb_faqs": [{"question_ar": "ما هي الخدمات التي توفرها NowPay ؟", "answer_ar": "تقدم NowPay مجموعة من الخدمات المالية المميزة، منها:\n\n🟢 الحصول على الراتب مقدمًا – يمكنك سحب جزء من راتبك في أي وقت من الشهر وتقسيطه على عدد محدد من الأشهر (يختلف حسب الشركة).\n\n🟢سداد الفواتير بسهولة – يمكنك دفع الفواتير مباشرة من خلال التطبيق وتأجيل السداد للشهر التالي.\n\n🟢تحويل الأموال – يمكنك إرسال الأموال لزملائك ولكن يشترط ان يكون موظف بنفس شركتك ولديه حساب مفعل على التطبيق\"\n\n🟢التسوق والتقسيط – يمكنك الشراء من خلال التطبيق أو من المتاجر المتعاقدة، مع إمكانية التقسيط على فترة محددة (حسب سياسة شركتك).\n\n✅ استمتع بإدارة مالية مرنة ومريحة مع NowPay", "answer_en": null, "video": null}, {"question_ar": "كيف يمكنني التسجيل في التطبيق؟", "answer_ar": "يمكنك التسجيل في التطبيق بسهولة باتباع الخطوات التالية:\n\n1️⃣ بعد تحميل التطبيق من المتجر.\n2️⃣ إدخال رقم الهاتف الخاص بك.\n3️⃣ ستصلك رسالة نصية تحتوي على رمز التحقق (OTP)، يجب إدخاله خلال 30 ثانية.\n4️⃣ إدخال الاسم.\n5️⃣ إنشاء كلمة مرور مكونة من 8 أحرف، على أن تتضمن:\n- حروف إنجليزية كبيرة وصغيرة\n- أرقام ورموز\n6️⃣ اختيار اسم الشركة التي تعمل بها.\n7️⃣ إدخال الكود الوظيفي، البريد الإلكتروني، والراتب.\n📌 ملحوظة: بعد التسجيل، عند فتح التطبيق ستظهر لك رسالة \"قم بإكمال طلب الالتحاق\"، حيث يمكنك تعديل البيانات البنكية أو إضافة الرقم القومي، ثم انتظار إجراءات التفعيل.", "answer_en": null, "video": "https://drive.google.com/file/d/1Y6FYudiZ2nQakxgWNyp2Jt2-k2hfLfw_/view?usp=sharing"}, {"question_ar": "كيف يمكنني تغيير كلمة السر علي التطبيق؟", "answer_ar": "✳️ لتعديل كلمة السر، يُرجى اتباع الخطوات التالية:\n\n📌 خطوات تغيير كلمة السر:\n1️⃣ فتح التطبيق.\n2️⃣ إدخال رقم الهاتف المسجّل.\n3️⃣ اختيار \"تغيير كلمة السر\".\n4️⃣ سيتم إرسال كود تحقق إلى هاتفك، قم بإدخاله في المكان المخصص.\n5️⃣ بعد ذلك، سيُطلب منك أحد الآتي:\nإدخال الرقم القومي (من اليسار إلى اليمين).\nإدخال آخر 6 أرقام من رقم الحساب البنكي (من اليسار إلى اليمين).\n\n📌 ملاحظة هامة:\nفي حال لم تكن قد سجلت بيانات رقم قومي أو حساب بنكي مسبقًا على التطبيق، سيتم تحويلك تلقائيًا إلى رقم خدمة العملاء.\n\n☎️ يرجى التواصل معنا لمساعدتك بشكل كامل.", "answer_en": null, "video": "https://drive.google.com/file/d/1O39nhH1L3GallRrDGyMwAgfc6ez-B6PR/view?usp=sharing"}, {"question_ar": "كيف يمكنني الحصول علي مكافأة دعوة صديق؟", "answer_ar": "✳️ استفد من مكافأة مالية عند دعوة زملائك للتسجيل على التطبيق!\n\n📌 كيفية الحصول على المكافأة:\n1️⃣ قم بدعوة أحد زملائك العاملين بنفس شركتك للتسجيل على التطبيق.\n2️⃣ بعد التسجيل، يقوم زميلك بتقديم طلب قبض راتب مقدم عبر التطبيق.\n3️⃣ بمجرد تحويل المبلغ بنجاح إلى زميلك، تحصل أنت تلقائيًا على مكافأة مالية قدرها 50 جنيهًا.\n\n💰 يمكنك استخدام المكافأة كرصيد لشحن الهاتف مباشرة من خلال التطبيق.\n\n📌 دعوة الزملاء = رصيد مجاني!", "answer_en": null, "video": "https://drive.google.com/file/d/1r2jCnJOs9DAVSykIxneAdWc4wNAMBDAZ/view?usp=drive_link"}, {"question_ar": "ما هي إجراءات تفعيل الحساب، وكم تستغرق من الوقت؟", "answer_ar": "تتم مراجعة بياناتك خلال12 يوم عمل، وسيتم التواصل مع قسم الموارد البشرية الخاص بك لتأكيد البيانات. بعد التأكيد، سيتم تفعيل الحساب خلال 48 ساعة عمل.\n\nلمتابعة حالة الطلب، يمكنك استخدام التطبيق من خلال:\n✅ الضغط على \"قيد الانتظار\" في أعلى الشاشة الرئيسية لمشاهدة الخطوات المتبقية.\n✅ ستصلك رسالة نصية عند تفعيل الحساب.\n\n📌 ملحوظة: يتم التفعيل خلال 12 يوم  عمل، مع استثناء يومي الجمعة والسبت.", "answer_en": null, "video": "https://drive.google.com/file/d/1AQupRnsqyig-mKGe2z3Ua9_DDkzhhT3X/view?usp=drive_link"}, {"question_ar": "كيف يمكنني طلب سلفة مقدماً من خلال التطبيق؟", "answer_ar": "يمكنك طلب سلفة مقدماً بسهولة من خلال التطبيق باتباع الخطوات التالية:\n\n1️⃣ فتح التطبيق وتسجيل الدخول باستخدام رقم الهاتف وكلمة المرور.\n2️⃣ ستظهر القيمة المتاحة لك في الصفحة الرئيسية.\n3️⃣ الضغط على \"اقبض مقدماً\".\n4️⃣ اختيار المبلغ المطلوب.\n5️⃣ تحديد عدد الأشهر للتقسيط، ثم التوقيع لإتمام الطلب.\n\n📌 لمتابعة حالة الطلب:\n1️⃣ الانتقال إلى الصفحة الرئيسية.\n2️⃣ الدخول إلى المعاملات.\n3️⃣ الضغط على المعاملة المراد التحقق منها.\n4️⃣ مراجعة حالة المعاملة:\n\n- إذا كانت \"اكتملت\"، فهذا يعني أنه تم تحويل المبلغ، ويمكنك التحقق من حسابك البنكي لاستلامه.", "answer_en": null, "video": "https://drive.google.com/file/d/1-CflbTHrm2ZysMxAbhNTKvzCK4bOI-CW/view"}, {"question_ar": "كم يستغرق تحويل الطلب، وكيف يمكنني متابعته؟", "answer_ar": "يتم تحويل الطلب خلال 48 ساعة عمل، ويمكنك متابعته من خلال التطبيق عبر الحالات التالية:\n\n🟢 قيد المعالجة\" – تم استلام الطلب من قبل الشركة.\n🟢 قيد التحويل\" – جاري تحويل المبلغ من خلالنا.\n🟢 اكتمل الطلب\" – تم التحويل بنجاح، ويمكنك التحقق من حسابك البنكي للاستلام.\n\n📌 يُمكنك متابعة حالة الطلب في أي وقت عبر التطبيق لضمان متابعة التحديثات أولاً بأول.", "answer_en": null, "video": "https://drive.google.com/file/d/10cBtWNWFkB-wTkJoEBWU2vAUDJMxsxOf/view?usp=sharing"}, {"question_ar": "لم يصلني التحويل وحالة الطلب (أكتملت)، ماذا يجب أن أفعل؟", "answer_ar": "يرجى مراجعة بياناتك البنكية المسجلة لدينا للتأكد من الاستعلام على الحساب الصحيح، وذلك عبر التحقق من:\n✅ اسم البنك\n✅ رقم الحساب البنكي المحول إليه\n\n📌 بعد تأكيد البيانات، نود طمأنتك بأن الطلب تم تحويله بنجاح من خلالنا. يرجى العلم أن بعض التحويلات قد تستغرق من يومين إلى 5 أيام عمل حتى تظهر في الحساب البنكي وفقاً لإجراءات البنك.\n\nفي حال عدم استلام المبلغ بعد هذه الفترة، يُفضل التواصل مع البنك للتحقق.", "answer_en": null, "video": null}, {"question_ar": "كيف يمكنني تعديل الطلب الذي قمت بتقديمه؟", "answer_ar": "✳️ يمكنك تعديل الطلب إذا كان قيد المعالجة من خلال اتباع الخطوات التالية:\n\n📌 خطوات التعديل:\n1️⃣ فتح التطبيق.\n2️⃣ الضغط على الطلب الذي ترغب في تعديله.\n3️⃣  اختيار \"تعديل الطلب\".\n4️⃣ ثم قم بتغيير المبلغ الذي قمت بطلبه او عدد الشهور التي قمت بتحديدها.\n\n✅ سيتم تعديل الطلب على الفور.", "answer_en": null, "video": "https://drive.google.com/file/d/11dZGVHRo_NPsK_xOTibSwpMD4sExryAu/view?usp=sharing"}, {"question_ar": "كيف يمكنني إلغاء الطلب الذي قمت بتقديمه؟", "answer_ar": "✳️ يمكنك إلغاء الطلب إذا كان قيد المعالجة من خلال اتباع الخطوات التالية:\n\n📌 خطوات الإلغاء:\n1️⃣ فتح التطبيق.\n2️⃣ الضغط على الطلب الذي ترغب في إلغائه.\n3️⃣  اختيار \"تعديل الطلب\".\n4️⃣ ثم الضغط على \"إلغاء الطلب\".\n\n✅ سيتم إلغاء الطلب على الفور.", "answer_en": null, "video": "https://drive.google.com/file/d/1fHSj-H4KXhTs3cBP9zJF-V6fQgInJU14/view?usp=sharing"}, {"question_ar": "كيف يمكنني تحويل الأموال إلى زميلي من خلال التطبيق؟", "answer_ar": "يمكنك تحويل الأموال بسهولة عبر ميزة \"تحويل للغير\" في التطبيق باتباع الخطوات التالية:\n\n1️⃣ فتح التطبيق واختيار \"تحويل للغير\" من الصفحة الرئيسية.\n2️⃣ إدخال رقم هاتف زميلك المسجل في التطبيق.\n3️⃣ اختيار المبلغ المراد تحويله وتحديد عدد الأشهر للتقسيط.\n4️⃣ سيتم تحويل المبلغ إلى الحساب البنكي الخاص بزميلك خلال 48 ساعة عمل.\n\n📌 لمتابعة حالة التحويل:\n1️⃣ الانتقال إلى الصفحة الرئيسية.\n2️⃣ الدخول إلى المعاملات.\n3️⃣ الضغط على المعاملة المراد التحقق منها.\n4️⃣ إذا كانت الحالة \"اكتملت\"، فهذا يعني أن التحويل قد تم بنجاح، ويمكنك التأكد مع زميلك من استلام المبلغ.", "answer_en": null, "video": "https://drive.google.com/file/d/1qsWFWvfKFfNrHi-ruNM6UblGpR-mPrHL/view?usp=sharing"}, {"question_ar": "كيف يمكنني دفع فواتيري من خلال التطبيق؟", "answer_ar": "يمكنك دفع فواتيرك بسهولة عبر التطبيق باتباع الخطوات التالية:\n\n1️⃣ الضغط على \"دفع فواتير\" من القائمة الرئيسية.\n2️⃣ اختيار \"نوع الفاتورة\".\n3️⃣ إدخال رقم الخاص بالفاتورة.\n4️⃣ سيتم عرض المبلغ والفاتورة على الشاشة.\n5️⃣ الضغط على \"طلب\" لإتمام الدفع.\n\n استمتع بتجربة دفع سهلة وسريعة عبر NowPay", "answer_en": null, "video": "https://drive.google.com/file/d/1IS8WrDHTEeHqKHKvA9KTSSwMWKcTAiiv/view?usp=sharing"}, {"question_ar": "كيف يمكنني التأكد من شحن الفاتورة بعد دفعها؟", "answer_ar": "يمكنك التأكد من شحن الفاتورة من خلال التطبيق باتباع الخطوات التالية:\n\n1️⃣ فتح التطبيق.\n2️⃣ الضغط على الفاتورة التي قمت بدفعها.\n3️⃣ ستظهر لك حالة الفاتورة على أنها \"اكتملت\".\n4️⃣ ستجد رقمًا مرجعيًا يؤكد نجاح عملية الدفع.", "answer_en": null, "video": "https://drive.google.com/file/d/1ZH1FxpiAF6G-UskiUU9AXs3yTFKXQ3op/view?usp=drive_link"}, {"question_ar": "ماذا أفعل إذا واجهت مشكلة في شحن الفاتورة ولم يصل الي قيمة الرصيد؟", "answer_ar": "إذا لم يتم تحديث حالة الطلب إلى \"اكتمل\"، يمكنك متابعة حالته من خلال التطبيق والتأكد من التفاصيل التالية:\n\n📌 يرجى التحقق من:\n\nالمبلغ الذي تم شحنه.\nالرقم الذي تم الشحن عليه.\nما إذا كان قد تم استلام المبلغ أم لا.\n📌 في حال لم يتم استل افقة."}, {"name": "Waiting HR Approval", "desc": "قام العميل بتسجيل الدخول وبياناته مكتملة، وفي انتظار إرسال بياناته إلى قسم الموارد البشرية. تم تحويل الطلب إلى فريق Partner Success لإرساله إلى HR الشركة للمراجعة. المدة: حتى 5 أيام عمل. إجراء الـ Agent: طمأنة العميل أن الطلب قيد المراجعة ولا يحتاج أي إجراء حاليًا."}, {"name": "Waiting HR Approval – Contacted", "desc": "تم إرسال البيانات إلى قسم الموارد البشرية وفي انتظار تأكيدها والموافقة. المدة: حتى 5 أيام عمل إضافية. إجراء الـ Agent: إبلاغ العميل أننا بانتظار رد HR ولا يوجد إجراء مطلوب منه حاليًا."}, {"name": "Missing ID", "desc": "المعنى: العميل لم يرفع صورة البطاقة أو أنها غير مكتملة. المطلوب من العميل: رفع صورة واضحة للبطاقة من التطبيق (وجه وظهر). إجراء الـ Agent: توضيح طريقة رفع البطاقة والتأكد من وضوحها."}, {"name": "Consent", "desc": "مطلوب توقيع إقرار/سند أمر (NowPay Consent). قد يتم إرسال المستند للعميل للتوقيع وإعادته، أو توقيعه لدى HR، أو يكون متوفرًا لدينا حسب سياسة الشركة. إجراء الـ Agent: توضيح الطريقة المناسبة حسب الشركة."}, {"name": "Probation Period", "desc": "العميل لم يكمل فترة العمل المطلوبة (غالبًا 6 أشهر) في شركته، وهي شرط للتفعيل لدى بعض الشركات. ملحوظة: مدة فترة التدريب بتختلف من شركة لشركة وممكن تزيد عن 6 شهور. إجراء الـ Agent: توضيح الشرط للعميل، والتفعيل يتم بعد استيفائه إذا كانت سياسة الشركة تنص على ذلك."}, {"name": "Active", "desc": "تم تفعيل الحساب."}]}, {"type": "list", "title": "أسباب حالة Pending والإجراء المطلوب", "items": ["Pending HR Letter: لازم الموظف يرفع خطاب HR حديث وموقّع ومختوم.", "Consent Not Signed: لازم الموظف يوقّع الإقرار مع الـ HR (بعض الشركات بتوفر نسخة إقرار داخلية).", "NowPay Consent Not Signed: لازم الموظف يوقّع إقرار NowPay مع مندوب NowPay، ويرفع النسخة الموقعة."]}, {"type": "list", "title": "Missing ID و Probation Period و إعادة إرسال لـ HR", "items": ["Missing ID: الموظف لازم يقدّم الكود الوظيفي + صورة واضحة للبطاقة (وجه وظهر).", "Probation Period: الموظف لسه ماكملش فترة التجربة، والتفعيل بيكمل بعد انتهاء الفترة وموافقة HR.", "Retry HR Approval: لو التفعيل اترفض، لازم نراجع سبب الرفض، نصحح المشكلة، ونعيد الإرسال لـ HR للموافقة."]}, {"type": "list", "title": "مشاكل تسجيل الدخول الشائعة وحلولها", "items": ["كلمة السر غلط: العميل يقدر يعمل Reset Password عن طريق اختيار \"Forgot Password\" ثم تأكيد إما الرقم القومي أو آخر 6 أرقام من الحساب البنكي المسجل، وبعدين إنشاء كلمة سر جديدة (لازم تحتوي حروف وأرقام ورموز).", "لو الرقم القومي مش مسجل: نجمع صورة واضحة للبطاقة من الأمام والخلف ونتأكد من كل بيانات العميل قبل الرفع.", "لو رقم الحساب البنكي غلط: ما نفصحش عن الرقم، ونوجّه العميل لبنكه أو لقسم الموارد البشرية عشان ياخد الرقم الصح."]}, {"type": "list", "title": "بيانات غير صحيحة / الشركة مش موجودة", "items": ["بيانات غير صحيحة: نتأكد من اسم الشركة، الكود الوظيفي، تاريخ التعيين، والرقم القومي، ونحدّث البيانات الصحيحة في السيستم.", "الشركة مش موجودة بالقائمة: نتأكد هل الشركة متعاقدة مع NowPay أم لا. لو متعاقدة نضيفها. لو مش معروفة، نسأل هل في زميل بيستخدم التطبيق بالفعل ونطلب رقمه للتأكد من اسم الشركة. لو مش متعاقدة، نطلب بيانات HR (الاسم، رقم الهاتف، إيميل الشركة)."]}, {"type": "list", "title": "مشاكل رفع المستندات", "items": ["طلب الرقم القومي تاني بعد الرفع: نجمع صور واضحة للبطاقة (وجه وظهر)، نرفعها على الحساب، ونتأكد من حالة الحساب بعد التحديث.", "تعذر رفع خطاب HR: نجمع خطاب HR حديث وموقّع ومختوم رسميًا، نرفعه على الحساب، ونحدّث حالة الحساب للخطوة التالية في التفعيل."]}, {"type": "validation", "title": "المطلوب التأكد منه أثناء المكالمة (Validation)", "items": ["اسم الشركة (Company Name) — للتأكد من التواصل مع قسم HR الصحيح.", "الكود الوظيفي (Staff ID) — المرجع الأساسي اللي بيستخدمه HR لتأكيد بيانات الموظف.", "تاريخ التعيين (Hiring Date) — للتأكد من انتهاء فترة الاختبار (Probation).", "الرقم القومي (NID)."]}, {"type": "notes", "items": ["أثناء المكالمة: نتأكد إن كل مستندات التفعيل المطلوبة مكتملة، والمستندات الناقصة ممكن تُجمع عن طريق الواتساب (الرقم القومي، إقرار Consent، خطاب HR).", "لازم نتأكد إن حالة الحساب متحدّثة صح في السيستم.", "دور فريق الـ Front-End: تجميع كل البيانات الناقصة من العملاء اللي في حالة Pending."]}, {"type": "list", "title": "دورة التواصل مع HR (Communication Cycle)", "items": ["بمجرد اكتمال كل المستندات، يتم التواصل مع HR خلال 5 أيام عمل.", "الـ Agent بيتأكد من: الراتب، تاريخ التعيين، المسمى الوظيفي، حالة التفعيل.", "HR بيتأكد من: الاسم بالكامل، الكود الوظيفي، الرقم القومي.", "HR بيرد خلال 5 أيام عمل من التواصل.", "بعد موافقة HR يتم تفعيل الحساب خلال 48 ساعة عمل.", "لو مفيش رد من HR خلال 5 أيام عمل، تتم المتابعة في أيام التواصل المجدولة مع HR لحد ما يوصل الرد."]}, {"type": "notes", "title": "التفعيل متأخر؟", "items": ["أول حاجة نراجع الـ Status ومدة بقاء الحساب في كل مرحلة.", "لو الطلب تجاوز 12 يوم عمل أو تجاوز الـ SLA الخاص بالمرحلة، يتم فتح Ticket للمتابعة مع Partner Success، ويكون الرد خلال يومي عمل.", "الـ SLA الكامل للتفعيل: حتى 12 يوم عمل. بعد التأكيد من HR يتم تفعيل الحساب خلال 48 ساعة عمل إضافية."]}, {"type": "list", "title": "إمتى أفتح Ticket؟", "items": ["لو التفعيل تجاوز 12 يوم عمل.", "لو الإجراءات الداخلية محتاجة متابعة مع Partner Success.", "لا يتم فتح Ticket لحالات زي Missing ID أو Waiting HR Approval طالما لسه داخل الـ SLA."]}, {"type": "notes", "title": "تذكرة تأخير التفعيل (Delay Activation Ticket)", "items": ["بتتبعت لما التفعيل يتأخر، وفريق Partner Success بيراجع السبب ويرد خلال 48 ساعة."]}, {"type": "list", "title": "الفريق المسؤول عن كل خطوة", "items": ["Partner Success: متابعة التفعيل والتواصل مع HR.", "HR (شركة العميل): اعتماد بيانات الموظف.", "Customer Support: مراجعة الحالة، توضيح الإجراءات، والمتابعة مع العميل."]}, {"type": "list", "title": "تتبع الحالة على Ops Tool", "items": ["Inquire / Activation / Activation Within: في حالة إن الحساب لم يتخطَّ 5 أيام من وقت التسجيل وكانت حالته Waiting HR Approval أو Ready to Approve، أو العميل بيتابع على التفعيل لكن حالة الحساب لسه Probation Period، أو تواصلنا مع HR ولسه في انتظار الرد لكن لسه داخل الـ 5 أيام.", "Report Issue / Activation / Delay Due to NowPay: في حالة تخطي اليوم المحدد للتواصل مع HR من غير ما نبعت بيانات العميل لإدارته لتأكيدها، أو العميل في حالة Consent أو Missing ID ومفيش تواصل من الـ Front-End لتجميع البيانات.", "Inquire / Activation / Delay Due to HR: بتُستخدم لو اتخطينا 5 أيام عمل من مخاطبة HR من غير أي رد أو تحديث بخصوص تفعيل الحساب. (ملحوظة: شركة IBS التأخير بيكون من طرف HR).", "Inquire or Action / Activation / Missing Consent: بتُستخدم لما الحساب في مرحلة توقيع الإقرار (Consent Not Signed أو Now Pay consent not signed) خلال أول 5 أيام عمل أو لو العميل ماردش لتجميع البيانات، أو في حالة تحميل الإقرار على حساب العميل."]}, {"type": "notes", "title": "نقاط الجودة أثناء مكالمات التفعيل", "items": ["التأكد من تاريخ التعيين، الكود الوظيفي، واسم الشركة.", "التعامل الصحيح مع البيانات الناقصة.", "إضافة الحساب بالحالة الصحيحة.", "الالتزام بالـ SLA.", "مراجعة Zoho: هل تم إرسال إيميل التفعيل من HR / من NowPay.", "تسجيل المكالمة صح على Ops Tool.", "التعامل مع التأخير والعملاء المستاءين بأسلوب مهني.", "استخدام نبرة احترافية والسكريبت المعتمد."]}, {"type": "faq", "title": "أسئلة شائعة عن التسجيل والتفعيل", "items": [{"q": "كيف يمكنني التسجيل في التطبيق؟", "a": "بعد تحميل التطبيق من المتجر، يتم إدخال رقم الهاتف، ثم إدخال رمز التحقق (OTP) خلال 30 ثانية، ثم إدخال الاسم، وإنشاء كلمة مرور من 8 أحرف (حروف كبيرة وصغيرة، أرقام، رموز)، ثم اختيار اسم الشركة، وإدخال الكود الوظيفي والبريد الإلكتروني والراتب. بعد التسجيل ستظهر رسالة \"قم بإكمال طلب الالتحاق\" لتعديل البيانات البنكية أو إضافة الرقم القومي.", "video": "https://drive.google.com/file/d/1Y6FYudiZ2nQakxgWNyp2Jt2-k2hfLfw_/view?usp=sharing"}, {"q": "ما هي إجراءات تفعيل الحساب، وكم تستغرق من الوقت؟", "a": "تتم مراجعة البيانات خلال 12 يوم عمل، ويتم التواصل مع قسم الموارد البشرية لتأكيد البيانات. بعد التأكيد، يتم تفعيل الحساب خلال 48 ساعة عمل. لمتابعة الحالة: الضغط على \"قيد الانتظار\" أعلى الشاشة الرئيسية لمشاهدة الخطوات المتبقية، وستصل رسالة نصية عند التفعيل. الجمعة والسبت لا يُحسبان كأيام عمل.", "video": "https://drive.google.com/file/d/1AQupRnsqyig-mKGe2z3Ua9_DDkzhhT3X/view?usp=drive_link"}, {"q": "كيف يمكنني تغيير كلمة السر على التطبيق؟", "a": "فتح التطبيق، إدخال رقم الهاتف المسجّل، اختيار \"تغيير كلمة السر\"، إدخال كود التحقق المرسل، ثم إدخال إما الرقم القومي أو آخر 6 أرقام من رقم الحساب البنكي. ملاحظة: لو لم تُسجَّل بيانات رقم قومي أو حساب بنكي من قبل، سيتم التحويل تلقائيًا لرقم خدمة العملاء.", "video": "https://drive.google.com/file/d/1O39nhH1L3GallRrDGyMwAgfc6ez-B6PR/view?usp=sharing"}]}, {"type": "videos", "items": ["https://drive.google.com/file/d/1Y6FYudiZ2nQakxgWNyp2Jt2-k2hfLfw_/view?usp=sharing", "https://drive.google.com/file/d/1AQupRnsqyig-mKGe2z3Ua9_DDkzhhT3X/view?usp=drive_link", "https://drive.google.com/file/d/1O39nhH1L3GallRrDGyMwAgfc6ez-B6PR/view?usp=sharing"]}, {"type": "related", "items": ["update-data", "validation-policy", "sla"]}]}, {"id": "limits-balance", "cat": "الرصيد والمعاملات", "title": "الحدود والرصيد (Limits & Balance)", "icon": "💳", "keywords": "DBR الحد الائتماني رصيد Cap Limit Active Loan Renewal رصيد سالب", "sections": [{"type": "overview", "text": "توضيح أنواع الحدود المطبّقة على رصيد العميل (الحد الأقصى للقسط الشهري DBR، الليميت الخاص بالإدارة Cap Limit، حد الطلبات النشطة)، وكل الأسئلة الخاصة برجوع الرصيد وزيادته."}, {"type": "list", "title": "ليه بيوضحلي إني متخطي الحد الأقصى للقسط الشهري (DBR)؟", "items": ["كل عميل ليه حد ائتماني المفروض ميتخطاهوش، وده نسبة معينة من صافي الراتب، وبالاتفاق مع شركته وبناءً على لوائح البنك المركزي.", "الحل لزيادته: الرجوع لشركته عشان تزود الراتب."]}, {"type": "list", "title": "ليه بيوضحلي إني مقدرش اسحب رغم إن في رصيد؟", "items": ["ممكن يكون متخطي الحد الأقصى للأقساط (DBR).", "ممكن يكون عنده Cap Limit، يعني ليميت من إدارته بمبلغ معين مقدرش يسحب أكتر منه في المرة الواحدة.", "ممكن يكون عنده Active Loan، يعني بعض الشركات بتسمح بطلبين نشطين، وإجمالي الطلبات ميزيدش عن 50% من الحد الأقصى (Max Balance)."]}, {"type": "list", "title": "ليه رصيدي مرجعش؟ (شركات الـ Renewal)", "items": ["لأننا لسه ما حصّلناش من شركة العميل، وعند التحصيل هيرجع الرصيد، وبنتابع بشكل مستمر مع الشركة.", "ملحوظة: مستخدمي شركات الـ Renewal مقدروش يسحبوا لحد ما الشركة تسدد المستحقات المتأخرة.", "نقدر نعرف موعد رجوع الرصيد من خلال داش بورد الخصومات (Deductions) في Renewal Balance، وده بيكون يوم الاستقطاع، وموضّح على التطبيق من خلال خانة التقارير."]}, {"type": "list", "title": "زيادة الراتب / الحد الائتماني (Increase Max Balance)", "items": ["الأساس: عن طريق إدارة الشركة (HR) بترسل طلب تحديث راتب لـ NowPay.", "بعض الشركات ممكن ترسل بيانات مفردات المرتب مباشرة (مثل Samcrete، PepsiCo).", "أو نبعت تيكيت بنفسنا لفريق Partner Success (لشركات زي Orange، Speed، Mass Food، IBS).", "بمجرد استلام الإيميل من إدارة الشركة، يتم تحديث الحد الائتماني خلال 48 ساعة عمل، ويقدر العميل يتابع الحد الجديد من التطبيق مباشرة."]}, {"type": "notes", "title": "قواعد خاصة بزيادة الحد الأقصى (Max Balance) حسب الشركة", "items": ["شركات (Orange – Speed – Mass Food – IBS): الطلب بيتحول لفريق Partner Success للتواصل مع HR.", "شركات (Samcrete – PepsiCo): التحديث بخطاب HR لو الزيادة أقل من 50% من صافي الراتب. لو الزيادة أكتر من 50%، الطلب بيتحول لفريق Partner Success.", "باقي الشركات: العميل بيتحول لإدارة شركته (HR) مباشرة."]}, {"type": "table_ref", "ref": "actions_increase_max_balance", "title": "متطلبات طلب زيادة الحد الأقصى"}, {"type": "notes", "title": "موافقة زيادة الراتب فوق 25%", "items": ["طلبات زيادة الراتب (Increase Max Balance) التي تتجاوز نسبة 25% من الراتب الحالي تتطلب الحصول على موافقة قبل تنفيذ الطلب."]}, {"type": "list", "title": "أسئلة أخرى عن الرصيد", "items": ["ممكن أجدول أقساطي؟ نعم، فقط في حالة إن الطلب لسه قيد المعالجة ونقدر نعدّله، غير كده منقدرش نجدول الأقساط.", "هل ممكن أدفع جزء عشان أسحب؟ للأسف مبنرجّحش ده للعميل.", "ليه رصيدي بالسالب؟ لو راتب العميل بقى أقل، الرصيد بيكون بالسالب لحد ما تنتهي الأقساط اللي كانت بالحد الأقصى القديم، وبعدها يرجع الرصيد بشكل طبيعي."]}, {"type": "list", "title": "حدود الفواتير والقروض النشطة", "items": ["الليميت الخاص بالفواتير: 2000 جنيه (بحسب ملاحظات الفريق الداخلية).", "حد الفواتير حسب دليل التدريب: لا يمكن سداد الفواتير لو إجمالي المبلغ تجاوز 2000 جنيه.", "القروض النشطة (Active Loans): بعض الشركات بتسمح بطلبين نشطين، على أن إجمالي الطلبات ميتخطاش 50% من الحد الأقصى."]}, {"type": "faq", "title": "أسئلة شائعة عن الحد الائتماني", "items": [{"q": "كيف يتم تحديد الحد الائتماني الخاص بي؟", "a": "يتم تحديده بناءً على الاتفاق بين NowPay وشركتك، وهو نسبة (%) من صافي راتبك كحد أقصى متاح، ولا يمكن تخطي هذه النسبة بناءً على لوائح البنك المركزي. يمكن معرفة الحد الائتماني المتاح من خلال التطبيق."}, {"q": "كيف يمكنني زيادة الحد الائتماني الخاص بي؟", "a": "يتم تحديث الراتب من خلال طلب من قسم الموارد البشرية إلى NowPay. بمجرد استلام الإيميل من إدارتك، يتم تحديث الحد الائتماني خلال 48 ساعة عمل، ويمكن متابعته من التطبيق مباشرة."}, {"q": "متى يتم استقطاع الراتب؟", "a": "يتم الاستقطاع في تاريخ الاستقطاع (يُحدَّد تلقائيًا حسب الشركة)، وهو اليوم اللي بنرسل فيه تقرير الأقساط المستحقة لشركتك. لو الطلب اتعمل قبل هذا التاريخ، يُحتسب القسط ضمن راتب الشهر الحالي. لو بعده، يُحتسب من الشهر القادم."}, {"q": "كيف يتم خصم الأقساط المستحقة؟", "a": "يتم الخصم من راتبك مباشرة من خلال قسم الموارد البشرية بعد استلامه تقريرًا شهريًا يوضح الخصومات المستحقة. يمكن متابعة تفاصيل الخصومات من خلال التطبيق."}, {"q": "كيف يمكنني معرفة الأقساط الخاصة بي؟", "a": "من خلال قائمة التقارير أسفل الشاشة في التطبيق، حيث تظهر تفاصيل الأقساط بما فيها الشهر وقيمته المستحقة. الأقساط تُخصم من الراتب في نهاية الشهر وليس بدايته.", "video": "https://drive.google.com/file/d/1nIdlIEIEmLScHGWcfxbWI-KuwjhVA2ag/view?usp=sharing"}, {"q": "في حالة وجود رصيد على التطبيق لكن لا يمكن للمستخدم إجراء معاملة جديدة (DBR)؟", "a": "يوجد حد أقصى للقسط الشهري بناءً على نسبة موضحة ومتفق عليها من الراتب، ولا يمكن تخطيها. يتم مراجعة حساب العميل لتوضيح متى سيكون السحب متاحًا مرة أخرى."}]}, {"type": "videos", "items": ["https://drive.google.com/file/d/1nIdlIEIEmLScHGWcfxbWI-KuwjhVA2ag/view?usp=sharing"]}, {"type": "related", "items": ["transactions", "fees-companies", "ops-tool-reasons"]}]}, {"id": "block-suspension", "cat": "الحساب والتفعيل", "title": "الحظر والإيقاف (Block & Suspension)", "icon": "🚫", "keywords": "حظر Block إيقاف Suspension إعادة تفعيل Reactivate استقالة نصب", "sections": [{"type": "list", "title": " عيل، عدم وجود بيانات بنكية، رصيد سالب، الحاجة لتوقيع إقرار Nadim/IBS/Raya RCX، أو خصومات تتخطى 100,000). التسجيل: Inquire / Transaction / Transaction Exceed 48.", "Transferred Exceed 48 Hrs: لو الطلب اتحول لكن تخطى 48 ساعة من غير ما يظهر في حساب العميل. التسجيل: Inquire / Transaction / Transferred Exceed 48.", "Bank Statement: لو العميل بيتابع طلب اتحول وتخطى 48 ساعة (تذكرة SLA: 24 ساعة). التسجيل: Inquire / Transaction / Bank Statement.", "Cancel Request: Action لو العميل عاوز يلغي طلب قيد المعالجة أو مرفوض قبل تاريخ الاستقطاع، أو Inquire لو بيسأل ازاي يلغي. ملحوظة: مينفعش نلغي طلب مرفوض بعد تاريخ الاستقطاع. التسجيل: (Action أو Inquire) / Transaction / Cancel Request.", "Create Salary Advance: Inquire لو بيسأل ازاي أو هل يقدر يعمل طلب، أو Action لو عملنا الطلب من عندنا. التسجيل: (Inquire أو Action) / Transaction / Create Salary Advance.", "Transfer Money: Inquire لو بيسأل عن تحويل الأموال أو بيتابع طلب اتحوّله من زميله. التسجيل: Inquire / Money Advance / Transfer Money.", "Change Number of Installments: Action لو غيّرنا عدد الأقساط بناءً على طلبه، أو Inquire لو بيسأل ازاي. ملحوظة: مينفعش نغيّر لو الطلب Transferring أو Transferred. التسجيل: Transaction / Change Number of Installments / (Action أو Inquire)."]}, {"type": "list", "title": "التطبيق (Mobile App)", "items": ["Download Issue: مشكلة في تحميل التطبيق (Issue) أو استفسار عن التحميل (Inquire). التسجيل: Mobile App / Download Issue / Inquire or Issue.", "OTP: Action لو العميل عاوز OTP لإعادة تعيين كلمة السر أو تسجيل الدخول (لازم التحقق قبل الإرسال). التسجيل: Mobile App / OTP / Action.", "Reset Password: Inquire لو بيسأل ازاي، أو Issue لو بيواجه مشكلة تحتاج Troubleshooting. التسجيل: Mobile App / Reset Password / Inquire.", "Upload: Issue لو في مشكلة في رفع بيانات (الرقم القومي / الكود الوظيفي). التسجيل: Mobile App / Upload / Issue."]}, {"type": "list", "title": "التسوق (Shopping)", "items": ["Delay in Delivery: تجاوز الـ SLA (5 أو 7 أيام عمل). التسجيل: Shopping / Delay in Delivery / Inquire.", "Offline Cancellation ."]}, {"type": "list", "title": "الحظر (Block)", "items": ["Blocking (Inquire): استفسار ليه حسابه محظور — الأسباب: خدمة غير مفعّلة (حسب HR)، استخدام خدمة تانية، استقالة، أو بناءً على طلبه.", "Blocking (Action): لو عاوز يحظر حسابه. السكريبت: نستفسر هل في مشكلة، ولو لأ نوضح إنه مفيش رسوم خدمة لو مش هيستخدم التطبيق. الإجراء: التحقق من بياناته وإرسال تذكرة للفريق الخلفي للحظر. ملحوظة: التأكد إن أي مستحقات هتتجمع وتُخصم في شهر واحد. التسجيل: Account / Block / Action or Inquire.", "Reactivate: حظر بناءً على طلب العميل ← يتحول لـ HR لإعادة التفعيل. خدمة غير مفعّلة ← نرسل من عندنا لدورة التفعيل ونحوّله لـ HR لو محتاج. لو كان مفقود قبل كده وسدّد كل المستحقات ← يتحول لـ HR. التسجيل: Block / Reactivate / Inquire.", "Suspension: حالات الإيقاف تشمل: إيقاف الشركة (مشكلة تحصيل)، Nadim (فترة إيقاف)، Petrojet (إيقاف لحد سداد كل المستحقات)، Adjustment (تأجيل المستحقات للشهر القادم)، إعلان نية الاستقالة (إيقاف لحد التحقيق)، وحالات الاشتباه في النصب (Fraud). التسجيل: Block / Suspension / Inquire."]}, {"type": "list", "title": "الحساب (About Account)", "items": ["General Inquire: استفسار عام غير متعلق بالتطبيق. التسجيل: About Account / General Inquire / Inquire.", "Services: استفسار عن خدمات التطبيق وإيه اللي بنقدمه. التسجيل: About Account / Services / Inquire."]}, {"type": "list", "title": "المالية (Finance)", "items": ["Settle Debt: لو بيسأل ازاي يسدد مستحقاته. التسجيل: Finance / Settle Debt / Inquire.", "Deposit: Inquire لو بعت إيداع وبيسأل عن الـ SLA، أو Action لو بعت سكرين شوت مع الدفع لقناة غير صوتية (Non-Voice)."]}, {"type": "table_ref", "ref": "actions_all", "title": "جدول الإجراءات الكامل (Actions Reference)"}, {"type": "related", "items": ["registration", "transactions", "block-suspension", "update-data", "dashboard-links", "ops-tool-links"]}]}, {"id": "faq-bank", "cat": "مرجع Ops", "title": "بنك الأسئلة الشائعة الكامل (FAQ)", "icon": "❓", "keywords": "اسئلة شائعة FAQ", "sections": [{"type": "overview", "text": "كل الأسئلة الشائعة اللي وردت في ملف الأسئلة والأجوبة (KB) في مكان ttps://operations.nowpay.cloud/callCenter", "uses": ["فتح ملف العميل (Customer Profile).", "تسجيل المكالمات.", "تحديث حالة العميل.", "تغيير اسم الشركة."]}, {"name": "Approved Users", "url": "https://operations.nowpay.cloud/approvedUsers", "uses": ["تحديث بيانات المستخدمين المعتمدين (Approved Users)."]}, {"name": "Users", "url": "https://operations.nowpay.cloud/users", "uses": ["إضافة بيانات مستخدم قيد الانتظار (Pending User).", "إنشاء إيقاف (Suspension).", "تحديث بيانات المستخدم."]}]}, {"type": "related", "items": ["dashboard-links", "ops-tool-reasons"]}]}, {"id": "quality-metrics", "cat": "مقاييس الجودة", "title": "مقاييس الجودة (Quality Metrics)", "icon": "📊", "keywords": "Quality Metrics جودة Soft Skills End-User Critical Business Critical Compliance Critical NC CC", "sections": [{"type": "overview", "text": "مصفوفة مقاييس الجودة المعتمدة لتقييم مكالمات خدمة العملاء، مقسّمة إلى أربع فئات: المهارات الشخصية (Soft Skills)، بنود حرجة على تجربة العميل (End-User Critical)، بنود حرجة على العمل (Business Critical)، وبنود حرجة على الالتزام (Compliance Critical)."}, {"type": "notes", "title": "أهم قاعدة: الـ Compliance Critical (CC)", "items": ["أي مخالفة ضمن بنود Compliance Critical (CC) تُسقط المكالمة بالكامل (Call Fail)، بغض النظر عن أداء الموظف في باقي البنود.", "بنود Business Critical و End-User Critical تُقيَّم كأخطاء حرجة (Critical) تؤثر بشكل مباشر على نتيجة المكالمة.", "بنود Soft Skills تنقسم إلى NC-Timing و NC-Behavior، وهي نقاط غير حرجة (Non-Critical / NC) تُخصم كنقاط تحسين ولا تُسقط المكالمة بمفردها."]}, {"type": "list", "title": "Soft Skills — المهارات الشخصية (بنود غير حرجة NC)", "items": ["Greeting Protocol / Closure Protocol — بروتوكول الترحيب وبروتوكول الإنهاء.", "NC-Timing: Hold Protocol (بروتوكول الانتظار)، Silence/Mute (الصمت/كتم الصوت).", "NC-Behavior: Active Listening (الإنصات الفعّال)، Empathy/Flexibility (التعاطف والمرونة)، Over Verification (تحقق زائد عن الحاجة)، Slang/unprofessional Words (ألفاظ غير مهنية)، Language barrier (حاجز اللغة)، Typing issue/Voice Tone (مشاكل الكتابة أو نبرة الصوت)، Interruption (المقاطعة)."]}, {"type": "list", "title": "End-User Critical — بنود حرجة على تجربة العميل", "items": ["Attitude Over The Phone — 1-Attitude: Ownership and willingness to support، Avoidance of support، Showing Empathy، More lively scenario، Extra Miles-Solutions.", "Attitude Over The Phone — 2-Timing: Long silence، long hold، Readiness، Early since scripte.", "Attitude Over The Phone — 3-Behavior: Rude Behavior، Over Interruption، Unnecessary Hold، Transaction Release، Language Barrier.", "Process And System Actions — 1-Acknowedgement: Acknowledgement User Request، Lack Of Concentration، Asking Effective Questions.", "Process And System Actions — 2-Correct Troubleshooting: Correct Complete Solution، System Utilization.", "Process And System Actions — 3-Documentation: Ticket Protocol/Ticket Direction.", "Process And System Actions — 4-Cs close looping: Internal Follow up، External Follow up، SLA."]}, {"type": "list", "title": "Business Critical — بنود حرجة على العمل", "items": ["1-Company Image: Call Etiquettes (آداب المكالمة)، Internals (الإجراءات الداخلية).", "2-Reporting (Contact Reason) — تسجيل سبب التواصل بشكل صحيح."]}, {"type": "list", "title": "Compliance Critical (CC) — بنود حرجة على الالتزام، تُسقط المكالمة بالكامل", "items": ["1-Verification Process — عملية التحقق من هوية وبيانات العميل.", "2-Data Protection — حماية بيانات العميل.", "3-Closing Procedures/Customer Education — إجراءات الإغلاق وتوعية العميل."]}, {"type": "related", "items": ["ops-tool-reasons", "validation-policy"]}]}, {"id": "new-faqs", "cat": "مرجع Ops", "title": "كل الأسئلة الشائعة في مكان واحد", "icon": "❓", "keywords": "أسئلة شائعة كاملة مجمعة FAQ", "sections": [{"type": "faq", "title": "كل الأسئلة الشائعة (مجمعة)", "items": [{"q": "ما هي الخدمات التي توفرها NowPay ؟", "a": "تقدم NowPay مجموعة من الخدمات المالية المميزة، منها:\n\n🟢 الحصول على الراتب مقدمًا – يمكنك سحب جزء من راتبك في أي وقت من الشهر وتقسيطه على عدد محدد من الأشهر (يختلف حسب الشركة).\n\n🟢سداد الفواتير بسهولة – يمكنك دفع الفواتير مباشرة من خلال التطبيق وتأجيل السداد للشهر التالي.\n\n🟢تحويل الأموال – يمكنك إرسال الأموال لزملائك ولكن يشترط ان يكون موظف بنفس شركتك ولديه حساب مفعل على التطبيق\"\n\n🟢التسوق والتقسيط – يمكنك الشراء من خلال التطبيق أو من المتاجر المتعاقدة، مع إمكانية التقسيط على فترة محددة (حسب سياسة شركتك).\n\n✅ استمتع بإدارة مالية مرنة ومريحة مع NowPay"}, {"q": "كيف يمكنني التسجيل في التطبيق؟", "a": "يمكنك التسجيل في التطبيق بسهولة باتباع الخطوات التالية:\n\n1️⃣ بعد تحميل التطبيق من المتجر.\n2️⃣ إدخال رقم الهاتف الخاص بك.\n3️⃣ ستصلك رسالة نصية تحتوي على رمز التحقق (OTP)، يجب إدخاله خلال 30 ثانية.\n4️⃣ إدخال الاسم.\n5️⃣ إنشاء كلمة مرور مكونة من 8 أحرف، على أن تتضمن:\n- حروف إنجليزية كبيرة وصغيرة\n- أرقام ورموز\n6️⃣ اختيار اسم الشركة التي تعمل بها.\n7️⃣ إدخال الكود الوظيفي، البريد الإلكتروني، والراتب.\n📌 ملحوظة: بعد التسجيل، عند فتح التطبيق ستظهر لك رسالة \"قم بإكمال طلب الالتحاق\"، حيث يمكنك تعديل البيانات البنكية أو إضافة الرقم القومي، ثم انتظار إجراءات التفعيل."}, {"q": "كيف يمكنني تغيير كلمة السر علي التطبيق؟", "a": "✳️ لتعديل كلمة السر، يُرجى اتباع الخطوات التالية:\n\n📌 خطوات تغيير كلمة السر:\n1️⃣ فتح التطبيق.\n2️⃣ إدخال رقم الهاتف المسجّل.\n3️⃣ اختيار \"تغيير كلمة السر\".\n4️⃣ سيتم إرسال كود تحقق إلى هاتفك، قم بإدخاله في المكان المخصص.\n5️⃣ بعد ذلك، سيُطلب منك أحد الآتي:\nإدخال الرقم القومي (من اليسار إلى اليمين).\nإدخال آخر 6 أرقام من رقم الحساب البنكي (من اليسار إلى اليمين).\n\n📌 ملاحظة هامة:\nفي حال لم تكن قد سجلت بيانات رقم قومي أو حساب بنكي مسبقًا على التطبيق، سيتم تحويلك تلقائيًا إلى رقم خدمة العملاء.\n\n☎️ يرجى التواصل معنا لمساعدتك بشكل كامل."}, {"q": "كيف يمكنني الحصول علي مكافأة دعوة صديق؟", "a": "✳️ استفد من مكافأة مالية عند دعوة زملائك للتسجيل على التطبيق!\n\n📌 كيفية الحصول على المكافأة:\n1️⃣ قم بدعوة أحد زملائك العاملين بنفس شركتك للتسجيل على التطبيق.\n2️⃣ بعد التسجيل، يقوم زميلك بتقديم طلب قبض راتب مقدم عبر التطبيق.\n3️⃣ بمجرد تحويل المبلغ بنجاح إلى زميلك، تحصل أنت تلقائيًا على مكافأة مالية قدرها 50 جنيهًا.\n\n💰 يمكنك استخدام المكافأة كرصيد لشحن الهاتف مباشرة من خلال التطبيق.\n\n📌 دعوة الزملاء = رصيد مجاني!"}, {"q": "ما هي إجراءات تفعيل الحساب، وكم تستغرق من الوقت؟", "a": "تتم مراجعة بياناتك خلال12 يوم عمل، وسيتم التواصل مع قسم الموارد البشرية الخاص بك لتأكيد البيانات. بعد التأكيد، سيتم تفعيل الحساب خلال 48 ساعة عمل.\n\nلمتابعة حالة الطلب، يمكنك استخدام التطبيق من خلال:\n✅ الضغط على \"قيد الانتظار\" في أعلى الشاشة الرئيسية لمشاهدة الخطوات المتبقية.\n✅ ستصلك رسالة نصية عند تفعيل الحساب.\n\n📌 ملحوظة: يتم التفعيل خلال 12 يوم  عمل، مع استثناء يومي الجمعة والسبت."}, {"q": "كيف يمكنني طلب سلفة مقدماً من خلال التطبيق؟", "a": "يمكنك طلب سلفة مقدماً بسهولة من خلال التطبيق باتباع الخطوات التالية:\n\n1️⃣ فتح التطبيق وتسجيل الدخول باستخدام رقم الهاتف وكلمة المرور.\n2️⃣ ستظهر القيمة المتاحة لك في الصفحة الرئيسية.\n3️⃣ الضغط على \"اقبض مقدماً\".\n4️⃣ اختيار المبلغ المطلوب.\n5️⃣ تحديد عدد الأشهر للتقسيط، ثم التوقيع لإتمام الطلب.\n\n📌 لمتابعة حالة الطلب:\n1️⃣ الانتقال إلى الصفحة الرئيسية.\n2️⃣ الدخول إلى المعاملات.\n3️⃣ الضغط على المعاملة المراد التحقق منها.\n4️⃣ مراجعة حالة المعاملة:\n\n- إذا كانت \"اكتملت\"، فهذا يعني أنه تم تحويل المبلغ، ويمكنك التحقق من حسابك البنكي لاستلامه."}, {"q": "كم يستغرق تحويل الطلب، وكيف يمكنني متابعته؟", "a": "يتم تحويل الطلب خلال 48 ساعة عمل، ويمكنك متابعته من خلال التطبيق عبر الحالات التالية:\n\n🟢 قيد المعالجة\" – تم استلام الطلب من قبل الشركة.\n🟢 قيد التحويل\" – جاري تحويل المبلغ من خلالنا.\n🟢 اكتمل الطلب\" – تم التحويل بنجاح، ويمكنك التحقق من حسابك البنكي للاستلام.\n\n📌 يُمكنك متابعة حالة الطلب في أي وقت عبر التطبيق لضمان متابعة التحديثات أولاً بأول."}, {"q": "لم يصلني التحويل وحالة الطلب (أكتملت)، ماذا يجب أن أفعل؟", "a": "يرجى مراجعة بياناتك البنكية المسجلة لدينا للتأكد من الاستعلام على الحساب الصحيح، وذلك عبر التحقق من:\n✅ اسم البنك\n✅ رقم الحساب البنكي المحول إليه\n\n📌 بعد تأكيد البيانات، نود طمأنتك بأن الطلب تم تحويله بنجاح من خلالنا. يرجى العلم أن بعض التحويلات قد تستغرق من يومين إلى 5 أيام عمل حتى تظهر في الحساب البنكي وفقاً لإجراءات البنك.\n\nفي حال عدم استلام المبلغ بعد هذه الفترة، يُفضل التواصل مع البنك للتحقق."}, {"q": "كيف يمكنني تعديل الطلب الذي قمت بتقديمه؟", "a": "✳️ يمكنك تعديل الطلب إذا كان قيد المعالجة من خلال اتباع الخطوات التالية:\n\n📌 خطوات التعديل:\n1️⃣ فتح التطبيق.\n2️⃣ الضغط على الطلب الذي ترغب في تعديله.\n3️⃣  اختيار \"تعديل الطلب\".\n4️⃣ ثم قم بتغيير المبلغ الذي قمت بطلبه او عدد الشهور التي قمت بتحديدها.\n\n✅ سيتم تعديل الطلب على الفور."}, {"q": "كيف يمكنني إلغاء الطلب الذي قمت بتقديمه؟", "a": "✳️ يمكنك إلغاء الطلب إذا كان قيد المعالجة من خلال اتباع الخطوات التالية:\n\n📌 خطوات الإلغاء:\n1️⃣ فتح التطبيق.\n2️⃣ الضغط على الطلب الذي ترغب في إلغائه.\n3️⃣  اختيار \"تعديل الطلب\".\n4️⃣ ثم الضغط على \"إلغاء الطلب\".\n\n✅ سيتم إلغاء الطلب على الفور."}, {"q": "كيف يمكنني تحويل الأموال إلى زميلي من خلال التطبيق؟", "a": "يمكنك تحويل الأموال بسهولة عبر ميزة \"تحويل للغير\" في التطبيق باتباع الخطوات التالية:\n\n1️⃣ فتح التطبيق واختيار \"تحويل للغير\" من الصفحة الرئيسية.\n2️⃣ إدخال رقم هاتف زميلك المسجل في التطبيق.\n3️⃣ اختيار المبلغ المراد تحويله وتحديد عدد الأشهر للتقسيط.\n4️⃣ سيتم تحويل المبلغ إلى الحساب البنكي الخاص بزميلك خلال 48 ساعة عمل.\n\n📌 لمتابعة حالة التحويل:\n1️⃣ الانتقال إلى الصفحة الرئيسية.\n2️⃣ الدخول إلى المعاملات.\n3️⃣ الضغط على المعاملة المراد التحقق منها.\n4️⃣ إذا كانت الحالة \"اكتملت\"، فهذا يعني أن التحويل قد تم بنجاح، ويمكنك التأكد مع زميلك من استلام المبلغ."}, {"q": "كيف يمكنني دفع فواتيري من خلال التطبيق؟", "a": "يمكنك دفع فواتيرك بسهولة عبر التطبيق باتباع الخطوات التالية:\n\n1️⃣ الضغط على \"دفع فواتير\" من القائمة الرئيسية.\n2️⃣ اختيار \"نوع الفاتورة\".\n3️⃣ إدخال رقم الخاص بالفاتورة.\n4️⃣ سيتم عرض المبلغ والفاتورة على الشاشة.\n5️⃣ الضغط على \"طلب\" لإتمام الدفع.\n\n استمتع بتجربة دفع سهلة وسريعة عبر NowPay"}, {"q": "كيف يمكنني التأكد من شحن الفاتورة بعد دفعها؟", "a": "يمكنك التأكد من شحن الفاتورة من خلال التطبيق باتباع الخطوات التالية:\n\n1️⃣ فتح التطبيق.\n2️⃣ الضغط على الفاتورة التي قمت بدفعها.\n3️⃣ ستظهر لك حالة الفاتورة على أنها \"اكتملت\".\n4️⃣ ستجد رقمًا مرجعيًا يؤكد نجاح عملية الدفع."}, {"q": "ماذا أفعل إذا واجهت مشكلة في شحن الفاتورة ولم يصل الي قيمة الرصيد؟", "a": "إذا لم يتم تحديث حالة الطلب إلى \"اكتمل\"، يمكنك متابعة حالته من خلال التطبيق والتأكد من التفاصيل التالية:\n\n📌 يرجى التحقق من:\n\nالمبلغ الذي تم شحنه.\nالرقم الذي تم الشحن عليه.\nما إذا كان قد تم استلام المبلغ أم لا.\n📌 في حال لم يتم استلام المبلغ:\n\nيرجي التواصل معنا علي هذا البريد Support@nowpay.com وسنقوم بالمتابعة مع القسم المختص للتحقق من حالة الشحن."}, {"q": "كيف يمكنني التسوق من خلال التطبيق؟", "a": "يمكنك التسوق بسهولة عبر التطبيق باتباع الخطوات التالية:\n\n1️⃣ اختيار المنتج المطلوب، حيث ستظهر جميع التفاصيل والسعر.\n2️⃣ الضغط على \"استمرار\" وإدخال عنوان الاستلام.\n3️⃣ الضغط على \"استمرار\" مرة أخرى لمراجعة تفاصيل الطلب، الدفع، والعنوان.\n4️⃣ الضغط على \"توقيع\"، ثم كتابة اسمك على الشاشة.\n5️⃣ أخيرًا، الضغط على \"طلب\" لإتمام الشراء.\nملحوظه: يتم استلام الطلب فى خلال 4ل5 ايام عمل فى القاهره و الجيزه عدا المحافظات فى خلال 7 ايام عمل \nاستمتع بتجربة تسوق سهلة ومريحة عبر NowPay"}, {"q": "كيف يمكنني التسوق من المتاجر المتاحة على التطبيق؟", "a": "يمكنك التسوق من المتاجر المتاحة على التطبيق بسهولة عبر الخطوات التالية:\n\n1️⃣ التوجه إلى المتجر واختيار المنتج الذي ترغب في شرائه.\n2️⃣ إبلاغ البائع بأنك ستدفع من خلال NowPay.\n3️⃣ قم بمسح رمز الـ QR من خلال هاتفك.\n4️⃣ ستظهر لك خيارات التقسيط وعدد الأشهر المتاحة.\n5️⃣ اختيار خطة التقسيط المناسبة واستكمال الطلب.\n\n استمتع بتجربة تسوق سهلة ومرنة مع NowPay"}, {"q": "كيف يمكنني التسوق عبر NowPay؟", "a": "يمكنك التسوق بسهولة عبر المتاجر الإلكترونية المتعاقدة مع NowPay باتباع الخطوات التالية:\n\n1️⃣ الدخول إلى الموقع الإلكتروني للمتجر الذي ترغب في الشراء منه.\n2️⃣ اختيار المنتج الذي تود شراءه.\n3️⃣ عند الدفع، تحديد NowPay كطريقة الدفع.\n4️⃣ استكمال الطلب وفقًا للإرشادات الظاهرة على الشاشة.\n\n📌 هذه الخدمة متاحة فقط لدى المتاجر التالية:\n✅ Dream2000\n✅ Dubai Phone\n✅ Town Team\n✅ IQ Store\n\n استمتع بتجربة تسوق مريحة ومرنة مع NowPay"}, {"q": "كيف يتم تحديد الحد الائتماني الخاص بي؟", "a": "يتم تحديد الحد الائتماني الخاص بك بناءً على الاتفاق بين NowPay وشركتك، حيث يتم احتساب نسبة (%) من صافي راتبك كحد أقصى متاح لك و لا يمكن تخطى هذه النسبه بناءا على لوائح البنك المركزى \n\n يمكنك معرفة الحد الائتماني المتاح لك من خلال التطبيق."}, {"q": "كيف يمكنني زيادة الحد الائتماني الخاص بي؟", "a": "يمكنك زيادة الحد الائتماني الخاص بك من خلال اتباع الخطوات التالية:\n\n1️⃣يتم تحديث الراتب من خلال ارسال طلب من قسم الموارد البشرية الخاص بك  إلى NowPay.\n2️⃣ بمجرد استلام البريد الإلكتروني من إدارتك، سيتم تحديث الحد الائتماني خلال 48 ساعة عمل.\n3️⃣ يمكنك متابعة الحد الائتماني الجديد مباشرة من خلال التطبيق.\n\nلمزيد من التفاصيل، يُفضل مراجعة قسم الموارد البشرية في شركتك."}, {"q": "متي يتم استقطاع الراتب؟", "a": "يتم استقطاع الراتب الخاص بك في تاريخ الاستقطاع ( يتم تحديد اليوم تلقائيا حسب الشركة)، وهو اليوم الذي نقوم فيه بإرسال تقرير الأقساط المستحقة لشركتك لجميع الموظفين.\n\n📌 في حال إجراء طلب قبل هذا التاريخ، يتم احتساب القسط ضمن راتب الشهر الحالي.\n📌 أما إذا تم إجراء الطلب بعد هذا التاريخ، فسيتم احتساب القسط ابتداءً من الشهر القادم.\n\n يمكنك التحقق من تفاصيل الأقساط المستحقة عبر التطبيق في أي وقت."}, {"q": "كيف يتم خصم الأقساط المستحقة؟", "a": "يتم خصمه من راتبك مباشراً من خلال قسم الموارد البشرية الخاص بك بعد استلامه تقريرًا شهريًا يوضح الخصومات المستحقة.\n\n يمكنك التحقق من تفاصيل الخصومات من خلال التطبيق."}, {"q": "كيف يمكنني معرفة الأقساط الخاصة بي؟", "a": "يمكنك الاطلاع على أقساطك المستحقة بسهولة من خلال التطبيق عبر الخطوات التالية:\n\n1️⃣ فتح التطبيق والتوجه إلى قائمة التقارير الموجودة في أسفل الشاشة.\n2️⃣ ستظهر لك تفاصيل الأقساط، بما في ذلك الشهر وقيمته المستحقة.\n\n📌 يرجى العلم:\nيتم خصم الأقساط من الراتب في نهاية الشهر، وليس في بدايته.\n\nمثال: شهر يناير يتم خصمه بنهاية يناير وليس بداية يناير."}, {"q": "كيف يمكنني إضافة أو تعديل بياناتي البنكية؟", "a": "يمكنك إضافة أو تعديل بياناتك البنكية بسهولة من خلال إرسالها عبر البريد الإلكتروني.\n\n📌 لإرسال البيانات عبر البريد الإلكتروني:\n1️⃣ فتح التطبيق والضغط على الأيقونة أعلى الشاشة.\n2️⃣ اختيار \"أرسل إيميل\".\n3️⃣ تضمين البيانات التالية في  "a": "بيتم الخصم عن طريق اننا بنبعت تقرير بالاقساط لشركتك كل شهر فى يوم الاستقطاع\nو يتم الخصم من خلال ادارتك قبل نزول الراتب"}, {"q": "بيتم الخصم امتى؟", "a": "بيتم الخصم من الراتب بشكل طبيعى كل شهر و تقدر تتاكد من خلال التقارير اسفل الشاشه"}, {"q": "عاوز مخالصه اعمل ايه و بتستخرج امتى؟", "a": "بتاكد لو الاول العميل مخلص كل المديونيه اللى عليه و بعدها بنتاكد لو هى مخالصه عاديه فبتاخد 3 ايام عمل اما لو مخالصه بنكيه فبتاخد 15 يوم عمل"}, {"q": "عاوز شهاده مديونيه ايه الجراءات؟", "a": "لو عاديه بتستخرج فى خلال 3 ايام عمل و لو بنكيه فى خلال 15 يوم عمل"}, {"q": "ازاى اتسوق من التطبيق او المتجر؟", "a": "⃣1️لدخول إلى الموقع الإلكتروني للمتجر الذي ترغب في الشراء منه.\n2️⃣ اختيار المنتج الذي تود شراءه.\n3️⃣ عند الدفع، تحديد NowPay كطريقة الدفع.\n4️⃣ استكمال الطلب وفقًا للإرشادات الظاهرة على الشاشة."}, {"q": "الطلب بيوصل فى خلال اد ايه؟", "a": "بيوصل فى خلال 4ل5 ايام عمل لو جوه القاهره و 5ل7 ايام لو خارج القاهره"}, {"q": "فى منتج مش متوفر على التطبيق محتاجه؟", "a": "يا اما بنرجع لجوهر  لو يقدر يوفر المنتج يا اما\nبنوضحله انه يقدر يتوجه للفروع اننا متعاقدين معاها"}, {"q": "ازاى اشترى سبايك؟", "a": "اتبع الخطوات التالية:\n:1: اختر \"استثمر مع ناو باي\" من أعلى الشاشة الرئيسية.\n:2: اضغط على السبائك المتاحة واختر خطة التقسيط المناسبة لك.\n:3: سيتم توصيل المنتج خلال 7 أيام عمل.\n:: ملحوظة:\nفي حال اخترت الاستلام من المتجر، سيكون خلال 3 إلى 4 أيام عمل، وسيتم التواصل معك من خلال المتجر لتأكيد الاستلام."}, {"q": "رصيدى مش مكفى اشترى المنتج؟", "a": "ممكن حضرتك تقسط المبلغ اللى فى الرصيد و الباقى تدفعه كاش"}, {"q": "هل التسوق عليه رسوم؟", "a": "اه بيكون عليه رسوم زى سحب المبلغ  كده و قبل ما نعمل طلب بيتوضح الرسوم"}, {"q": "ايه العروض المتوفره ؟", "a": "بيتوفر عروض من وقت للتانى و بيتم ارسال رسايل نصيه باى عروض جديده"}, {"q": "موجود فى المتجر و بيقولوا انه مفيش تعاقد؟", "a": "وقتها بنتواصل مع حد من قسم الميرشنت و هما يحلوا المشكله بنبعت على جروب واتس اب"}, {"q": "ازاى استخدم قسايم فتح الله؟", "a": "بينزل تطبيق فتح الله بنفس الاسم و الرقم المسجلين على ناو باى\nو بيختار من ناوى باى القس الخدمات التي توفرها NowPay ؟", "answer_ar": "تقدم NowPay مجموعة من الخدمات المالية المميزة، منها:\n\n🟢 الحصول على الراتب مقدمًا – يمكنك سحب جزء من راتبك في أي وقت من الشهر وتقسيطه على عدد محدد من الأشهر (يختلف حسب الشركة).\n\n🟢سداد الفواتير بسهولة – يمكنك دفع الفواتير مباشرة من خلال التطبيق وتأجيل السداد للشهر التالي.\n\n🟢تحويل الأموال – يمكنك إرسال الأموال لزملائك ولكن يشترط ان يكون موظف بنفس شركتك ولديه حساب مفعل على التطبيق\"\n\n🟢التسوق والتقسيط – يمكنك الشراء من خلال التطبيق أو من المتاجر المتعاقدة، مع إمكانية التقسيط على فترة محددة (حسب سياسة شركتك).\n\n✅ استمتع بإدارة مالية مرنة ومريحة مع NowPay", "answer_en": null, "video": null}, {"question_ar": "كيف يمكنني التسجيل في التطبيق؟", "answer_ar": "يمكنك التسجيل في التطبيق بسهولة باتباع الخطوات التالية:\n\n1️⃣ بعد تحميل التطبيق من المتجر.\n2️⃣ إدخال رقم الهاتف الخاص بك.\n3️⃣ ستصلك رسالة نصية تحتوي على رمز التحقق (OTP)، يجب إدخاله خلال 30 ثانية.\n4️⃣ إدخال الاسم.\n5️⃣ إنشاء كلمة مرور مكونة من 8 أحرف، على أن تتضمن:\n- حروف إنجليزية كبيرة وصغيرة\n- أرقام ورموز\n6️⃣ اختيار اسم الشركة التي تعمل بها.\n7️⃣ إدخال الكود الوظيفي، البريد الإلكتروني، والراتب.\n📌 ملحوظة: بعد التسجيل، عند فتح التطبيق ستظهر لك رسالة \"قم بإكمال طلب الالتحاق\"، حيث يمكنك تعديل البيانات البنكية أو إضافة الرقم القومي، ثم انتظار إجراءات التفعيل.", "answer_en": null, "video": "https://drive.google.com/file/d/1Y6FYudiZ2nQakxgWNyp2Jt2-k2hfLfw_/view?usp=sharing"}, {"question_ar": "كيف يمكنني تغيير كلمة السر علي التطبيق؟", "answer_ar": "✳️ لتعديل كلمة السر، يُرجى اتباع الخطوات التالية:\n\n📌 خطوات تغيير كلمة السر:\n1️⃣ فتح التطبيق.\n2️⃣ إدخال رقم الهاتف المسجّل.\n3️⃣ اختيار \"تغيير كلمة السر\".\n4️⃣ سيتم إرسال كود تحقق إلى هاتفك، قم بإدخاله في المكان المخصص.\n5️⃣ بعد ذلك، سيُطلب منك أحد الآتي:\nإدخال الرقم القومي (من اليسار إلى اليمين).\nإدخال آخر 6 أرقام من رقم الحساب البنكي (من اليسار إلى اليمين).\n\n📌 ملاحظة هامة:\nفي حال لم تكن قد سجلت بيانات رقم قومي أو حساب بنكي مسبقًا على التطبيق، سيتم تحويلك تلقائيًا إلى رقم خدمة العملاء.\n\n☎️ يرجى التواصل معنا لمساعدتك بشكل كامل.", "answer_en": null, "video": "https://drive.google.com/file/d/1O39nhH1L3GallRrDGyMwAgfc6ez-B6PR/view?usp=sharing"}, {"question_ar": "كيف يمكنني الحصول علي مكافأة دعوة صديق؟", "answer_ar": "✳️ استفد من مكافأة مالية عند دعوة زملائك للتسجيل على التطبيق!\n\n📌 كيفية الحصول على المكافأة:\n1️⃣ قم بدعوة أحد زملائك العاملين بنفس شركتك للتسجيل على التطبيق.\n2️⃣ بعد التسجيل، يقوم زميلك بتقديم طلب قبض راتب مقدم عبر التطبيق.\n3️⃣ بمجرد تحويل المبلغ بنجاح إلى زميلك، تحصل أنت تلقائيًا على مكافأة مالية قدرها 50 جنيهًا.\n\n💰 يمكنك استخدام المكافأة كرصيد لشحن الهاتف مباشرة من خلال التطبيق.\n\n📌 دعوة الزملاء = رصيد مجاني!", "answer_en": null, "video": "https://drive.google.com/file/d/1r2jCnJOs9DAVSykIxneAdWc4wNAMBDAZ/view?usp=drive_link"}, {"question_ar": "ما هي إجراءات تفعيل الحساب، وكم تستغرق من الوقت؟", "answer_ar": "تتم مراجعة بياناتك خلال12 يوم عمل، وسيتم التواصل مع قسم الموارد البشرية الخاص بك لتأكيد البيانات. بعد التأكيد، سيتم تفعيل الحساب خلال 48 ساعة عمل.\n\nلمتابعة حالة الطلب، يمكنك استخدام التطبيق من خلال:\n✅ الضغط على \"قيد الانتظار\" في أعلى الشاشة الرئيسية لمشاهدة الخطوات المتبقية.\n✅ ستصلك رسالة نصية عند تفعيل الحساب.\n\n📌 ملحوظة: يتم التفعيل خلال 12 يوم  عمل، مع استثناء يومي الجمعة والسبت.", "answer_en": null, "video": "https://drive.google.com/file/d/1AQupRnsqyig-mKGe2z3Ua9_DDkzhhT3X/view?usp=drive_link"}, {"question_ar": "كيف يمكنني طلب سلفة مقدماً من خلال التطبيق؟", "answer_ar": "يمكنك طلب سلفة مقدماً بسهولة من خلال التطبيق باتباع الخطوات التالية:\n\n1️⃣ فتح التطبيق وتسجيل الدخول باستخدام رقم الهاتف وكلمة المرور.\n2️⃣ ستظهر القيمة المتاحة لك في الصفحة الرئيسية.\n3️⃣ الضغط على \"اقبض مقدماً\".\n4️⃣ اختيار المبلغ المطلوب.\n5️⃣ تحديد عدد الأشهر للتقسيط، ثم التوقيع لإتمام الطلب.\n\n📌 لمتابعة حالة الطلب:\n1️⃣ الانتقال إلى الصفحة الرئيسية.\n2️⃣ الدخول إلى المعاملات.\n3️⃣ الضغط على المعاملة المراد التحقق منها.\n4️⃣ مراجعة حالة المعاملة:\n\n- إذا كانت \"اكتملت\"، فهذا يعني أنه تم تحويل المبلغ، ويمكنك التحقق من حسابك البنكي لاستلامه.", "answer_en": null,   /* ---------------- dom helpers ---------------- */
  function el(tag, attrs, ...children){
    const e = document.createElement(tag);
    if(attrs) for(const k in attrs){
      if(k === "class") e.className = attrs[k];
      else if(k === "html") e.innerHTML = attrs[k];
      else if(k.startsWith("on") && typeof attrs[k] === "function") e.addEventListener(k.slice(2), attrs[k]);
      else if(attrs[k] !== false && attrs[k] !== null && attrs[k] !== undefined) e.setAttribute(k, attrs[k]);
    }
    children.flat().forEach(c => {
      if(c === null || c === undefined) return;
      if(typeof c === "string") e.appendChild(document.createTextNode(c));
      else e.appendChild(c);
    });
    return e;
  }
  function esc(s){ return s===null||s===undefined ? "" : String(s); }

  function uniqLines(arr){
    const seen = new Set(); const out = [];
    arr.forEach(block=>{
      if(!block) return;
      String(block).split(/\n/).forEach(line=>{
        const t = line.trim();
        if(!t || t === "-" || t.toLowerCase()==="null") return;
        if(!seen.has(t)){ seen.add(t); out.push(t); }
      });
    });
    return out;
  }

  /* ---------------- expand an actions_ref table into per-category synthetic sections ---------------- */
  function expandActionsRef(ref){
    const rows = DATA[ref] || [];
    const validationItems = uniqLines(rows.map(r=>r.validation)).concat(uniqLines(rows.map(r=>r.data_verification)));
    const validationUniq = uniqLines(validationItems);
    let bestQP = ""; rows.forEach(r=>{ if(r.quality_point && r.quality_point.length > bestQP.length) bestQP = r.quality_point; });
    const qpSteps = (bestQP||"").split(/\n/).map(s=>s.replace(/^\s*\d+[-.)]\s*/,'').trim()).filter(Boolean);
    const opsChips = [];
    rows.forEach(r=>{ if(r.ops_tool_record) opsChips.push({label:(r.type||"").split("\n")[0], value:r.ops_tool_record}); });
    return {
      validation: {type:"actions_validation", title:"التحقق المطلوب قبل تنفيذ الإجراء", items: validationUniq},
      agent_actions: {type:"actions_steps", title:"خطوات الموظف أثناء المكالمة", items: qpSteps},
      ticket_info: {type:"actions_full", title:"تفاصيل الإجراءات", rows: rows},
      ops_tool: {type:"actions_chips", title:"تسجيل Ops Tool حسب نوع الإجراء", items: opsChips}
